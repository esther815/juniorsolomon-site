    var h=(location.hash||'').slice(1), one=ids.indexOf(h)>=0;
    all('[data-intro]').forEach(function(s){s.hidden=one});
    ids.forEach(function(id){all('[id="'+id+'"]').forEach(function(s){s.hidden=one&&id!==h; s.style.borderTop=one?'none':''})});
    all('[id="progbar"]').forEach(function(b){b.hidden=!one});
    if(one){setTimeout(function(){window.scrollTo(0,0)},0)}
  }
  window.addEventListener('hashchange',apply);
  window.addEventListener('load',apply); apply();
})();
</script>
