<div style="padding: 56px 0; border-top: 1px solid #EEEAF0">
<p style="margin: 0 0 14px; font-size: 14px; letter-spacing: 0.08em; color: #5F3D66">무엇을 기르나요</p>
<h3 style="margin: 0; max-width: 760px; font-family: 'Noto Serif KR', serif; font-weight: 600; font-size: clamp(24px, 2.6vw, 34px); line-height: 1.45; letter-spacing: -0.02em">책을 얼마나 많이 읽었는가보다,<br>한 권의 책 앞에서 얼마나 깊이 생각했는가.</h3>
<p style="margin: 20px 0 0; max-width: 760px; font-size: 17px; line-height: 1.85; color: #3A3440">주니어솔로몬은 좋은 책을 통해 세 가지 힘을 기릅니다. 정답을 빨리 찾는 힘이 아니라, 오래 붙들고 생각하는 힘입니다.</p>
<div style="margin-top: 36px; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px">
<div style="padding: 28px; border-radius: 20px; background: #FAF8FB"><p style="margin: 0 0 10px; font-family: 'Noto Serif KR', serif; font-size: 15px; color: #5F3D66">하나</p><h4 style="margin: 0 0 10px; font-family: 'Noto Serif KR', serif; font-size: 21px; font-weight: 600">깊이 생각하는 힘</h4><p style="margin: 0; font-size: 15px; line-height: 1.8; color: #5E5866">좋은 작품을 골라 천천히 읽습니다. 작품에 쓰인 사실과 그에 대한 나의 해석을 구분해 말하도록 지도합니다.</p></div>
<div style="padding: 28px; border-radius: 20px; background: #FAF8FB"><p style="margin: 0 0 10px; font-family: 'Noto Serif KR', serif; font-size: 15px; color: #5F3D66">둘</p><h4 style="margin: 0 0 10px; font-family: 'Noto Serif KR', serif; font-size: 21px; font-weight: 600">스스로 질문하는 힘</h4><p style="margin: 0; font-size: 15px; line-height: 1.8; color: #5E5866">수업은 선생님의 질문이 아니라 학생의 질문에서 시작합니다. 책을 읽고 질문 세 개를 만든 뒤, 가장 묻고 싶은 하나를 고릅니다.</p></div>
<div style="padding: 28px; border-radius: 20px; background: #FAF8FB"><p style="margin: 0 0 10px; font-family: 'Noto Serif KR', serif; font-size: 15px; color: #5F3D66">셋</p><h4 style="margin: 0 0 10px; font-family: 'Noto Serif KR', serif; font-size: 21px; font-weight: 600">생각을 표현하는 힘</h4><p style="margin: 0; font-size: 15px; line-height: 1.8; color: #5E5866">짝 앞에서 근거를 들어 말하고, 다른 생각을 듣고, 필요하면 내 생각을 고칩니다. 대화로 다듬은 생각은 한 편의 글로 완성합니다.</p></div>
</div>
</div>

<div style="padding: 56px 0; border-top: 1px solid #EEEAF0">
<p style="margin: 0 0 14px; font-size: 14px; letter-spacing: 0.08em; color: #5F3D66">수업은 이렇게 흘러갑니다</p>
<h3 style="margin: 0; font-family: 'Noto Serif KR', serif; font-weight: 600; font-size: clamp(24px, 2.6vw, 34px); line-height: 1.45; letter-spacing: -0.02em">읽고, 묻고, 따지고, 씁니다.</h3>
<ol style="list-style: none; margin: 36px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); border-top: 1px solid #1E1A22">
<li style="padding: 24px 18px 0 0"><p style="margin: 0 0 6px; font-size: 13px; color: #5F3D66">1</p><h4 style="margin: 0 0 8px; font-family: 'Noto Serif KR', serif; font-size: 19px; font-weight: 600">함께 읽기</h4><p style="margin: 0; font-size: 15px; line-height: 1.75; color: #5E5866">그날의 작품을 소리 내어 함께 읽습니다.</p></li>
<li style="padding: 24px 18px 0; border-left: 1px solid #EEEAF0"><p style="margin: 0 0 6px; font-size: 13px; color: #5F3D66">2</p><h4 style="margin: 0 0 8px; font-family: 'Noto Serif KR', serif; font-size: 19px; font-weight: 600">질문 만들기</h4><p style="margin: 0; font-size: 15px; line-height: 1.75; color: #5E5866">궁금한 것을 질문으로 적고, 가장 묻고 싶은 하나를 고릅니다.</p></li>
<li style="padding: 24px 18px 0; border-left: 1px solid #EEEAF0"><p style="margin: 0 0 6px; font-size: 13px; color: #5F3D66">3</p><h4 style="margin: 0 0 8px; font-family: 'Noto Serif KR', serif; font-size: 19px; font-weight: 600">하브루타</h4><p style="margin: 0; font-size: 15px; line-height: 1.75; color: #5E5866">짝과 마주 앉아 질문을 주고받고, 근거를 들어 묻고 따집니다.</p></li>
<li style="padding: 24px 18px 0; border-left: 1px solid #EEEAF0"><p style="margin: 0 0 6px; font-size: 13px; color: #5F3D66">4</p><h4 style="margin: 0 0 8px; font-family: 'Noto Serif KR', serif; font-size: 19px; font-weight: 600">글쓰기</h4><p style="margin: 0; font-size: 15px; line-height: 1.75; color: #5E5866">대화로 다듬은 생각을 내 문장으로 씁니다.</p></li>
<li style="padding: 24px 0 0 18px; border-left: 1px solid #EEEAF0"><p style="margin: 0 0 6px; font-size: 13px; color: #5F3D66">5</p><h4 style="margin: 0 0 8px; font-family: 'Noto Serif KR', serif; font-size: 19px; font-weight: 600">나눔</h4><p style="margin: 0; font-size: 15px; line-height: 1.75; color: #5E5866">쓴 글을 발표하고, 친구의 글에 한마디를 건넵니다.</p></li>
</ol>
<p style="margin: 28px 0 0; font-size: 15px; line-height: 1.8; color: #5E5866">한 반은 최대 8명, 보통 6명입니다. 모든 아이가 한 수업에서 자기 질문을 말하고, 자기 글을 씁니다.</p>
</div>

<div style="padding: 56px 0; border-top: 1px solid #EEEAF0">
<p style="margin: 0 0 14px; font-size: 14px; letter-spacing: 0.08em; color: #5F3D66">일주일은 이렇게</p>
<h3 style="margin: 0; font-family: 'Noto Serif KR', serif; font-weight: 600; font-size: clamp(24px, 2.6vw, 34px); line-height: 1.45; letter-spacing: -0.02em"><span style="white-space: nowrap">토론하는 날,</span> <span style="white-space: nowrap">읽는 날,</span> <span style="white-space: nowrap">스스로 익히는 날.</span></h3>
<p style="margin: 20px 0 0; max-width: 760px; font-size: 17px; line-height: 1.85; color: #3A3440">토론만으로는 생각이 자라지 않습니다. 충분히 읽고, 혼자 익히는 시간이 받쳐 줄 때 토론이 깊어집니다. 그래서 세 수업을 한 과정으로 묶었습니다.</p>
<div style="margin-top: 32px; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px">
<div style="padding: 28px; border: 1px solid #EEEAF0; border-radius: 20px"><p style="margin: 0 0 8px; font-size: 13px; color: #5F3D66">주 1회 · 초등 120분 · 유아 90분</p><h4 style="margin: 0 0 10px; font-family: 'Noto Serif KR', serif; font-size: 21px; font-weight: 600">하브루타 수업</h4><p style="margin: 0; font-size: 15px; line-height: 1.8; color: #5E5866">같은 반 친구들과 정해진 요일에 만납니다. 한 권의 책을 두고 질문하고 토론하고 글을 씁니다.</p></div>
<div style="padding: 28px; border: 1px solid #EEEAF0; border-radius: 20px"><p style="margin: 0 0 8px; font-size: 13px; color: #5F3D66">주 1회 · 120분 · 예약제</p><h4 style="margin: 0 0 10px; font-family: 'Noto Serif KR', serif; font-size: 21px; font-weight: 600">문해력 집중 독서</h4><p style="margin: 0; font-size: 15px; line-height: 1.8; color: #5E5866">8,000권이 넘는 학원 장서에서 책을 골라 읽고 독서 기록을 남깁니다. 선생님이 곁에서 지켜보고, 읽은 시간만큼 별 도장을 모읍니다.</p></div>
<div style="padding: 28px; border: 1px solid #EEEAF0; border-radius: 20px"><p style="margin: 0 0 8px; font-size: 13px; color: #5F3D66">주 1회 · 120분 · 예약제</p><h4 style="margin: 0 0 10px; font-family: 'Noto Serif KR', serif; font-size: 21px; font-weight: 600">문해력 자기주도 학습</h4><p style="margin: 0; font-size: 15px; line-height: 1.8; color: #5E5866">12월부터 학원이 직접 만든 솔로몬 QUEST 학습지를 풉니다. 이번 주 뉴스와 언어·탐구 학습지를 학년에 맞게 받아 스스로 익히고, 시험에 통과하면 도장깨기 판에 도장을 받습니다. 혼자 끝까지 해내는 습관을 기릅니다.</p></div>
</div>
<p style="margin: 24px 0 0; font-size: 15px; line-height: 1.8; color: #5E5866">독서와 자기주도 학습은 평일 오후 2시~7시, 토요일 오전 9시~오후 4시 가운데 편한 시간을 네이버 예약으로 고릅니다. 세 수업 모두 월 교습비에 포함됩니다.</p>
</div>

<div style="padding: 56px 0; border-top: 1px solid #EEEAF0">
<p style="margin: 0 0 14px; font-size: 14px; letter-spacing: 0.08em; color: #5F3D66">글쓰기는 이렇게 자랍니다</p>
<h3 style="margin: 0; font-family: 'Noto Serif KR', serif; font-weight: 600; font-size: clamp(24px, 2.6vw, 34px); line-height: 1.45; letter-spacing: -0.02em">한 번에 긴 글을 요구하지 않습니다.</h3>
<p style="margin: 20px 0 0; max-width: 760px; font-size: 17px; line-height: 1.85; color: #3A3440">충분히 읽고 대화한 결과를 기록하는 것이 글쓰기입니다. 낱말에서 시작해 한 문장, 200자 한 문단을 거쳐 논술까지 한 걸음씩 나아갑니다. 글자 수를 늘리는 것이 목표가 아닙니다. 짧은 글에 생각을 단단히 담을 수 있을 때 다음 분량으로 갑니다.</p>
<div style="margin-top: 28px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 6px; font-size: 15px">
<span style="display: inline-flex; align-items: center; gap: 8px"><span style="padding: 8px 14px; border-radius: 999px; background: #FAF8FB">낱말</span><span style="color: #B9AFC0">→</span></span>
<span style="display: inline-flex; align-items: center; gap: 8px"><span style="padding: 8px 14px; border-radius: 999px; background: #FAF8FB">한 문장</span><span style="color: #B9AFC0">→</span></span>
<span style="display: inline-flex; align-items: center; gap: 8px"><span style="padding: 8px 14px; border-radius: 999px; background: #FAF8FB">200자 한 문단</span><span style="color: #B9AFC0">→</span></span>
<span style="display: inline-flex; align-items: center; gap: 8px"><span style="padding: 8px 14px; border-radius: 999px; background: #FAF8FB">400자</span><span style="color: #B9AFC0">→</span></span>
<span style="display: inline-flex; align-items: center; gap: 8px"><span style="padding: 8px 14px; border-radius: 999px; background: #FAF8FB">600자</span><span style="color: #B9AFC0">→</span></span>
<span style="display: inline-flex; align-items: center; gap: 8px"><span style="padding: 8px 14px; border-radius: 999px; background: #FAF8FB">800자</span><span style="color: #B9AFC0">→</span></span>
<span style="display: inline-flex; align-items: center; gap: 8px"><span style="padding: 8px 14px; border-radius: 999px; background: #FAF8FB">1,000자</span><span style="color: #B9AFC0">→</span></span>
<span style="padding: 8px 14px; border-radius: 999px; background: #F3EEF5; color: #5F3D66; font-weight: 600">1,200자 논술</span>
</div>
<p style="margin: 24px 0 0; font-size: 15px; line-height: 1.8; color: #5E5866">분기마다 성장 점검으로 지금의 자리를 살피고, 준비가 된 아이는 다음 단계의 반으로 옮겨 갑니다.</p>
</div>

<div style="padding: 56px 0 0; border-top: 1px solid #EEEAF0; display: flex; flex-wrap: wrap; gap: 40px">
<div style="flex: 1 1 280px; min-width: 0"><p style="margin: 0 0 14px; font-size: 14px; letter-spacing: 0.08em; color: #5F3D66">수업의 뿌리</p><h3 style="margin: 0; font-family: 'Noto Serif KR', serif; font-weight: 600; font-size: clamp(24px, 2.6vw, 34px); line-height: 1.45; letter-spacing: -0.02em">2017년, 이촌동에서.</h3></div>
<div style="flex: 999 1 520px; min-width: 0"><p style="margin: 0; font-size: 17px; line-height: 1.85; color: #3A3440">짝과 같은 글을 읽고 서로 묻고 답하는 유대인의 전통 학습법 하브루타, 매튜 립먼이 세운 어린이 철학(P4C), 그리고 「왜 그렇게 생각하니?」를 끝까지 이어 가는 소크라테스의 연속 질문. 주니어솔로몬은 이 세 가지를 하나의 우리말 수업으로 엮어 2017년부터 이촌동 아이들과 함께해 왔습니다. 세 방법은 특별한 날에만 꺼내는 것이 아니라 모든 수업에 들어 있습니다.</p><p style="margin: 16px 0 0; font-size: 17px; line-height: 1.85; color: #3A3440">문제집은 조각이고, 책은 한 편의 생각입니다. 아이가 가지고 태어난 원석을 좋은 책으로 다듬는 일, 그것이 하브루타 정규반입니다.</p></div>
</div>

<div style="padding: 56px 0 0; margin-top: 56px; border-top: 1px solid #EEEAF0; display: flex; flex-wrap: wrap; gap: 40px">
<div style="flex: 1 1 280px; min-width: 0"><p style="margin: 0 0 14px; font-size: 14px; letter-spacing: 0.08em; color: #5F3D66">교실의 설계</p><h3 style="margin: 0; font-family: 'Noto Serif KR', serif; font-weight: 600; font-size: clamp(24px, 2.6vw, 34px); line-height: 1.45; letter-spacing: -0.02em">생각하는 뇌에는<br>당과 산소가 필요합니다.</h3></div>
<div style="flex: 999 1 520px; min-width: 0"><p style="margin: 0; font-size: 17px; line-height: 1.85; color: #3A3440">묻고 답하고 다시 묻는 수업에서 아이들은 머리를 많이 씁니다. 뇌가 일하는 데 꼭 필요한 두 가지, 당과 산소를 교실에서 먼저 챙깁니다.</p>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-top: 24px">
<div style="padding: 22px; border-radius: 18px; background: #FAF6FB"><p style="margin: 0 0 8px; font-size: 13px; font-weight: 700; color: #5F3D66">당 · 궁금이 박스</p><p style="margin: 0; font-size: 15px; line-height: 1.8; color: #3A3440">수업을 마치면 아이들은 「궁금이 박스」에서 캔디나 젤리를 하나씩 뽑습니다. 배움은 달콤하다는 것을 몸으로 기억하게 하고 싶었습니다. 처음 글을 배우는 아이에게 꿀을 맛보게 했다는 유대인의 옛이야기에서 얻은 생각입니다.</p></div>
<div style="padding: 22px; border-radius: 18px; background: #F2F7FB"><p style="margin: 0 0 8px; font-size: 13px; font-weight: 700; color: #2C5AA0">산소 · 창문과 환기</p><p style="margin: 0; font-size: 15px; line-height: 1.8; color: #3A3440">교실을 설계할 때 모든 교실에 창문을 냈습니다. 수업마다 창을 열어 환기하고, 신선한 공기 속에서 수업합니다. 바깥의 나쁜 공기에 대비해 로비에는 <span style="white-space:nowrap">공기청정기(IQAir)를</span> 두었습니다.</p></div>
</div>
<p style="margin: 22px 0 0; font-size: 15px; line-height: 1.8; color: #6E6676">아이가 오래 머무는 학원이라면, 그 교실에 창이 있는지 한번 살펴보세요.</p></div>
</div>

</div>
</div>
</section>

<h2 style="margin: 0; font-family: 'Noto Serif KR', serif; font-weight: 600; font-size: clamp(28px, 3.2vw, 42px); line-height: 1.3; letter-spacing: -0.03em">리딩오션 문해력</h2>

<div style="padding: 56px 0; border-top: 1px solid #EEEAF0">
<p style="margin: 0 0 14px; font-size: 14px; letter-spacing: 0.08em; color: #5F3D66">왜 리딩오션인가요</p>
<h3 style="margin: 0; max-width: 760px; font-family: 'Noto Serif KR', serif; font-weight: 600; font-size: clamp(24px, 2.6vw, 34px); line-height: 1.45; letter-spacing: -0.02em">많이 읽는 아이보다,<br>제대로 읽는 아이로.</h3>
<p style="margin: 20px 0 0; max-width: 760px; font-size: 17px; line-height: 1.85; color: #3A3440">책을 싫어하는 아이는 대개 자기 수준에 맞지 않는 책을 억지로 읽어 온 아이입니다. 리딩오션은 지금 아이의 읽기 수준을 먼저 재고, 거기에 맞는 책부터 정독하게 합니다. 읽은 내용을 문제로 확인하고, 글로 써서 내 것으로 만듭니다.</p>
<p style="margin: 16px 0 0; max-width: 760px; font-size: 15px; line-height: 1.8; color: #5E5866">리딩오션에듀는 경기·서울·광주 교육청의 독서교육시스템을 만든 (주)레듀텍의 학원 전용 독서교육 프로그램입니다. 주니어솔로몬은 이 프로그램을 리딩오션 동부이촌점으로 운영합니다.</p>
</div>

<div style="padding: 56px 0; border-top: 1px solid #EEEAF0">
<p style="margin: 0 0 14px; font-size: 14px; letter-spacing: 0.08em; color: #5F3D66">이렇게 읽습니다</p>
<h3 style="margin: 0; font-family: 'Noto Serif KR', serif; font-weight: 600; font-size: clamp(24px, 2.6vw, 34px); line-height: 1.45; letter-spacing: -0.02em">재고, 고르고, 읽고, 확인하고, 씁니다.</h3>
<ol style="list-style: none; margin: 36px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px">
<li style="padding: 24px; border-radius: 18px; background: #FAF8FB"><p style="margin: 0 0 8px; font-size: 13px; color: #5F3D66">1 · 재다</p><h4 style="margin: 0 0 8px; font-family: 'Noto Serif KR', serif; font-size: 19px; font-weight: 600">독서능력진단검사</h4><p style="margin: 0; font-size: 15px; line-height: 1.75; color: #5E5866">초등 국어 교과서의 어휘와 문장을 기준으로 만든 검사입니다. 독서지수를 141구간으로 나누어 알려 주고, 강점과 약점을 결과 리포트로 보여 줍니다.</p></li>
<li style="padding: 24px; border-radius: 18px; background: #FAF8FB"><p style="margin: 0 0 8px; font-size: 13px; color: #5F3D66">2 · 고르다</p><h4 style="margin: 0 0 8px; font-family: 'Noto Serif KR', serif; font-size: 19px; font-weight: 600">수준별 맞춤 도서</h4><p style="margin: 0; font-size: 15px; line-height: 1.75; color: #5E5866">교과 수록 도서, 국내외 수상작, 교육청 선정 도서, 기관 추천 도서 가운데 지금 내 수준에 맞는 책을 고릅니다.</p></li>
<li style="padding: 24px; border-radius: 18px; background: #FAF8FB"><p style="margin: 0 0 8px; font-size: 13px; color: #5F3D66">3 · 읽다</p><h4 style="margin: 0 0 8px; font-family: 'Noto Serif KR', serif; font-size: 19px; font-weight: 600">정독</h4><p style="margin: 0; font-size: 15px; line-height: 1.75; color: #5E5866">훑어 읽지 않고 깊이 읽습니다. 선생님이 곁에서 바로 코칭하고 피드백합니다.</p></li>
<li style="padding: 24px; border-radius: 18px; background: #FAF8FB"><p style="margin: 0 0 8px; font-size: 13px; color: #5F3D66">4 · 확인하다</p><h4 style="margin: 0 0 8px; font-family: 'Noto Serif KR', serif; font-size: 19px; font-weight: 600">독서미션</h4><p style="margin: 0; font-size: 15px; line-height: 1.75; color: #5E5866">OX 퀴즈, 낱말 퍼즐, 매칭 게임 같은 독후 문항으로 읽은 내용을 다시 짚습니다. 결과는 학부모님 카카오톡으로 바로 갑니다.</p></li>
<li style="padding: 24px; border-radius: 18px; background: #FAF8FB"><p style="margin: 0 0 8px; font-size: 13px; color: #5F3D66">5 · 쓰다</p><h4 style="margin: 0 0 8px; font-family: 'Noto Serif KR', serif; font-size: 19px; font-weight: 600">글쓰기</h4><p style="margin: 0; font-size: 15px; line-height: 1.75; color: #5E5866">내용 요약, 나와 관련짓기, 사회와 관련짓기, 가치 판단, 찬반 주장으로 생각을 넓혀 씁니다.</p></li>
</ol>

<div style="padding: 56px 0; border-top: 1px solid #EEEAF0; display: flex; flex-wrap: wrap; gap: 40px; align-items: flex-start">
<div style="flex: 1 1 280px; min-width: 0"><p style="margin: 0 0 14px; font-size: 14px; letter-spacing: 0.08em; color: #5F3D66">새로 더했습니다</p><h3 style="margin: 0; font-family: 'Noto Serif KR', serif; font-weight: 600; font-size: clamp(24px, 2.6vw, 34px); line-height: 1.45; letter-spacing: -0.02em">글봇쌤</h3><p style="margin: 10px 0 0; font-size: 15px; color: #5E5866">AI 논술 평가·첨삭</p></div>
<div style="flex: 999 1 520px; min-width: 0"><p style="margin: 0; font-size: 17px; line-height: 1.85; color: #3A3440">리딩오션 동부이촌점은 레듀텍의 초·중·고 AI 논술 평가·첨삭 프로그램 「글봇쌤」을 함께 씁니다. 아이가 쓴 글을 바로 평가받고, 고쳐 쓰기로 이어 갑니다. 서·논술형 평가가 늘어나는 학교 시험을 미리 준비하는 힘이 됩니다.</p></div>

<div style="padding: 56px 0; border-top: 1px solid #EEEAF0">
<p style="margin: 0 0 14px; font-size: 14px; letter-spacing: 0.08em; color: #5F3D66">동부이촌점은 다릅니다</p>
<h3 style="margin: 0; font-family: 'Noto Serif KR', serif; font-weight: 600; font-size: clamp(24px, 2.6vw, 34px); line-height: 1.45; letter-spacing: -0.02em">솔로몬 안의 리딩오션.</h3>
<div style="margin-top: 32px; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px">
<div style="padding: 28px; border: 1px solid #EEEAF0; border-radius: 20px"><h4 style="margin: 0 0 10px; font-family: 'Noto Serif KR', serif; font-size: 20px; font-weight: 600">8,000권의 서가 곁에서</h4><p style="margin: 0; font-size: 15px; line-height: 1.8; color: #5E5866">리딩오션 수업은 주니어솔로몬의 장서 8,000여 권이 둘러싼 공간에서 이루어집니다. 책이 가까이 있는 곳에서 읽는 습관이 자랍니다.</p></div>
<div style="padding: 28px; border: 1px solid #EEEAF0; border-radius: 20px"><h4 style="margin: 0 0 10px; font-family: 'Noto Serif KR', serif; font-size: 20px; font-weight: 600">하브루타로 가는 길</h4><p style="margin: 0; font-size: 15px; line-height: 1.8; color: #5E5866">2027년 3월부터 하브루타 정규반은 리딩오션으로 읽기의 기초를 다진 학생부터 들어갑니다. 리딩오션은 솔로몬 수업의 첫걸음입니다.</p></div>
<div style="padding: 28px; border: 1px solid #EEEAF0; border-radius: 20px"><h4 style="margin: 0 0 10px; font-family: 'Noto Serif KR', serif; font-size: 20px; font-weight: 600">석 달마다 다시 잽니다</h4><p style="margin: 0; font-size: 15px; line-height: 1.8; color: #5E5866">3·6·9·12월 독서능력진단검사로 읽기 수준이 어떻게 자랐는지 확인하고, 다음 책의 단계를 정합니다.</p></div>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); border-top: 1px solid #1E1A22">

<section id="sophos" style="border-top: 1px solid #EEEAF0">
