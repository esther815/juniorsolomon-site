<body>
<main class="wrap" id="out">
<img class="icon" src="assets/icon-192.png" alt="">
<div class="kick">앱 베타 테스터 신청</div>
<h1>함께 만들어 갈<br><em>열 분</em>을 모십니다</h1>
<p class="lead">정식 출시 전 2주 동안 「주니어솔로몬」 앱을 먼저 써 보시고 의견을 들려주세요.</p>
<div class="card">
 <div class="row"><b>대상</b><span>안드로이드 휴대폰을 쓰시는 재원생 학부모님</span></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  var sb=window.supabase.createClient('https://gyuuimwalbxsocnamtqk.supabase.co','sb_publishable_Kj2bX4fe9CRSkhvGzBbaJw_y1ZqkjOz');
  var f=document.getElementById('f'), m=document.getElementById('m'), go=document.getElementById('go');
  function err(t){ m.innerHTML='<div class="err">'+t+'</div>' }
  f.addEventListener('submit',function(ev){
    ev.preventDefault(); m.innerHTML='';
    var n=document.getElementById('n').value.trim(), e=document.getElementById('e').value.trim().toLowerCase(), c=document.getElementById('c').value.trim();
    if(!n) return err('학부모님 성함을 적어 주세요.');
    if(!/^[a-z0-9._%+-]+@(gmail\.com|googlemail\.com)$/.test(e)) return err('gmail 주소를 확인해 주세요. 플레이스토어는 구글 계정(gmail)으로만 초대할 수 있습니다.');
    if(!document.getElementById('ag').checked) return err('안내 문구에 동의해 주세요.');
    go.disabled=true; go.textContent='보내는 중…';
    sb.rpc('beta_signup',{p_name:n,p_email:e,p_child:c||null}).then(function(r){
      if(r.error){ go.disabled=false; go.textContent='신청하기'; return err(/잠시/.test(r.error.message)?'잠시 후 다시 시도해 주세요.':'신청하지 못했습니다. 문자(010-3212-8123)로 gmail 주소를 보내 주세요.') }
      document.getElementById('out').innerHTML='<img class="icon" src="assets/icon-192.png" alt=""><div class="done"><h2>신청이 접수되었습니다</h2><p style="margin:0;font-size:16px;color:#4E4356">시작하는 날 설치 링크를 보내 드립니다.<br>함께해 주셔서 고맙습니다.</p></div><p class="foot">문의 02-794-8123 · 문자 010-3212-8123</p>';
    });
  });
})();
</script>
