<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<title>상담용 수업 시간표 | 주니어솔로몬 원장 도구</title>
<meta name="robots" content="noindex,nofollow,noarchive">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/assets/consult-touch-icon.png">

<style>
:root{--p:#4E2F57;--p2:#5F3D66;--lav:#F4EFF6;--gold:#B8913A;--ink:#2B2530;--grey:#6E6676;--line:#E2D8E6;--cream:#FBF8F2}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;color:var(--ink);background:#EEE9F0;word-break:keep-all}
.app{display:grid;grid-template-columns:360px minmax(0,1fr);gap:24px;padding:24px;max-width:1240px;margin:0 auto}
@media(max-width:1000px){.app{grid-template-columns:minmax(0,1fr);padding:14px;gap:14px}}
.panel{background:#fff;border-radius:16px;padding:22px;align-self:start;position:sticky;top:24px;box-shadow:0 1px 3px rgba(60,30,70,.08)}
@media(max-width:1000px){.panel{position:static}}
.panel h2{font-family:'Noto Serif KR',serif;color:var(--p);font-size:20px}
.panel .cap{font-size:13px;color:var(--grey);margin-top:4px;line-height:1.6}
.stu{margin-top:14px;border:1px solid var(--line);border-radius:14px;padding:12px}
.stu .top{display:flex;gap:8px;align-items:center}
.stu input{flex:1;min-width:0;height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font:inherit;font-size:16px;background:#fff;color:var(--ink)}
.stu input:focus{outline:2px solid var(--p2);outline-offset:-1px}
.x{border:0;background:none;color:var(--grey);font-size:24px;cursor:pointer;width:36px;height:44px}
.grp{margin-top:10px}
.grp .gl{font-size:12px;color:var(--grey);margin-bottom:5px}
.chips{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.chip{height:40px;padding:0;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);font:inherit;font-size:15px;font-weight:500;cursor:pointer;-webkit-tap-highlight-color:transparent}
.chip.on{background:var(--p2);border-color:var(--p2);color:#fff;font-weight:700}
.add{margin-top:10px;border:1px dashed var(--gold);background:#FFFDF6;color:var(--p);border-radius:10px;height:40px;width:100%;font:inherit;font-weight:700;cursor:pointer}
.sibchk{display:none;margin-top:12px;font-size:14px;font-weight:700;color:var(--p);cursor:pointer;line-height:1.5}
.sibchk input{width:18px;height:18px;vertical-align:-3px;margin-right:6px;accent-color:#5F3D66}
.sibchk span{display:block;font-weight:400;font-size:12.5px;color:var(--grey);margin-left:24px}
.s-sib .dc{margin-top:9px;padding-top:8px;border-top:1px dashed #E2CF9F;font-size:13.5px;color:var(--p)}
.go{margin-top:18px;width:100%;height:52px;border:0;border-radius:999px;background:var(--p2);color:#fff;font:inherit;font-size:16px;font-weight:700;cursor:pointer}
.go:hover{background:#3E2546}.go:disabled{opacity:.5;cursor:default}
.msg{margin-top:10px;font-size:13px;color:var(--grey);min-height:18px;line-height:1.5}
.dv{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.dv>b{display:block;font-size:13px;color:var(--p);margin-bottom:8px}
.dv h4{font-size:14px;color:var(--p);margin:12px 0 6px}
.dv table{width:100%;border-collapse:collapse;font-size:13px}
.dv th{background:var(--lav);color:var(--p);font-weight:700;padding:5px 6px;text-align:left;font-size:12px}
.dv td{padding:6px;border-bottom:1px solid var(--line);white-space:nowrap}
.dv td.num{text-align:right;font-variant-numeric:tabular-nums}
.dv .mix{font-size:12px;color:var(--grey);margin-top:4px;line-height:1.5}
.dv tr.cl{cursor:pointer}.dv tr.cl:hover td{background:#FBF8F2}
.dv .ar{display:inline-block;width:12px;color:var(--gold);transition:transform .15s}.dv tr.op .ar{transform:rotate(90deg)}
.dv tr.ros td{white-space:normal;background:#FBF8F2;padding:6px 10px 10px}
.dv tr.ros ol{margin:0 0 0 18px;font-size:13px;line-height:1.75}
.dv tr.ros em{font-style:normal;font-size:11.5px;color:#8A4B5A;background:#F3E6EA;border-radius:6px;padding:1px 6px}
.dv .z{color:#8A4B5A;font-weight:700}.dv .g{color:#2F6B4A;font-weight:700}
.warn{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.warn b{display:block;font-size:13px;color:var(--p);margin-bottom:6px}
.warn li{font-size:13px;line-height:1.6;color:#5A4D60;margin:4px 0 4px 16px}
.data{margin-top:14px;font-size:12px;color:var(--grey);line-height:1.6}
.stage{overflow:hidden;min-width:0}
.fit{margin:0 auto;position:relative}
.fit .sheet{transform-origin:top left;position:absolute;left:0;top:0}
#shot{position:fixed;left:-10000px;top:0}
/* A4 sheet: 794 x 1123 px */
.sheet{width:794px;min-height:1123px;background:var(--cream);margin:0 auto;display:flex;flex-direction:column;box-shadow:0 2px 12px rgba(60,30,70,.15)}
.s-top{padding:22px 60px 0;text-align:center;position:relative}
.s-reg{position:absolute;right:44px;top:24px;font-size:11px;color:var(--grey)}
.s-logo{height:42px}
.s-h1{margin-top:12px;font-family:'Noto Serif KR',serif;font-size:28px;color:var(--p);font-weight:700;line-height:1.35}
.s-who{margin-top:10px;font-size:16px;color:var(--p);font-weight:700}
.s-sub{margin-top:6px;font-size:13.5px;color:var(--grey)}
.s-wrap{padding:8px 60px 14px;flex:1}
.s-sec{margin-top:10px}
.s-h2{display:flex;align-items:baseline;gap:12px;border-bottom:1.6px solid var(--p2);padding-bottom:6px;margin-bottom:8px}
.s-h2 .t{font-family:'Noto Serif KR',serif;font-size:20px;color:var(--p);font-weight:700;white-space:nowrap}
.s-h2 .s{font-size:12.5px;color:var(--grey)}
.s-tb{width:100%;border-collapse:collapse;background:#fff;border:0.8px solid var(--line)}
.s-tb th{background:var(--lav);color:var(--p);font-size:13px;font-weight:700;padding:6px 12px;text-align:left;border-bottom:0.8px solid var(--line)}
.s-tb td{font-size:14.5px;padding:5px 12px;border-bottom:0.8px solid var(--line);vertical-align:middle;white-space:nowrap}
.s-tb tr:last-child td{border-bottom:0}
.c1{width:42%}.c2{width:26%}
.sep td{background:var(--cream);color:var(--p);font-weight:700;font-size:12.5px;padding:5px 12px}
.bd{display:inline-block;border-radius:999px;padding:3px 13px;font-size:12.5px;font-weight:700;white-space:nowrap}
.ok{background:#E7F2EC;color:#2F6B4A}.soon{background:#FFF3DC;color:#9A6A12}.full{background:#F3E6EA;color:#8A4B5A}.new{background:var(--p2);color:#fff}
.s-sib{margin-top:12px;border:1.6px solid var(--gold);background:#FFFDF6;border-radius:12px;padding:13px 19px}
.s-sib .h{font-family:'Noto Serif KR',serif;color:var(--p);font-size:15.5px;font-weight:700}
.s-sib .r{margin-top:7px;font-size:14.5px;display:flex;align-items:center;gap:12px}
.s-sib .r .n{min-width:62px;font-weight:700;color:var(--p)}
.s-leg{margin-top:9px;font-size:12.5px;color:var(--grey);line-height:1.7}
.s-empty{background:#fff;border:0.8px solid var(--line);padding:12px;font-size:14px;color:var(--grey)}
.s-foot{background:#3E2546;color:#fff;padding:18px 60px}
.s-foot .row{display:flex;justify-content:space-between;align-items:center}
.s-tel{font-family:'Noto Serif KR',serif;font-size:20px;font-weight:700;white-space:nowrap}
.s-tel small{font-family:'Noto Sans KR';font-size:12px;font-weight:400;opacity:.85;margin-right:10px}
.s-foot img{height:32px}
.s-foot .i{margin-top:6px;font-size:11.5px;opacity:.85}

.modal{position:fixed;inset:0;background:rgba(30,15,35,.72);display:none;z-index:50;overflow:auto;-webkit-overflow-scrolling:touch}
.modal.on{display:block}
.mbox{max-width:720px;margin:24px auto;background:#fff;border-radius:18px;padding:18px}
@media(max-width:760px){.mbox{margin:0;border-radius:0;min-height:100%}}
.mbox h3{font-family:'Noto Serif KR',serif;color:var(--p);font-size:19px}
.mbox .fn{margin-top:4px;font-size:13px;color:var(--grey);word-break:break-all}
.mbox img{display:block;width:100%;margin-top:12px;border:1px solid var(--line);border-radius:6px;box-shadow:0 2px 10px rgba(60,30,70,.12)}
.acts{margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts button{height:54px;border-radius:14px;font:inherit;font-size:16px;font-weight:700;cursor:pointer;border:1.5px solid var(--p2);background:#fff;color:var(--p)}
.acts .kk{background:#FEE500;border-color:#FEE500;color:#191919;grid-column:1/-1}
.acts .pr{background:var(--p2);color:#fff}
.acts .bk{grid-column:1/-1;border:0;background:none;color:var(--grey);height:40px;font-weight:500;font-size:14px}
.mmsg{margin-top:8px;font-size:13px;color:var(--grey);min-height:18px;text-align:center}
.gate{max-width:420px;margin:80px auto;background:#fff;border-radius:16px;padding:28px;text-align:center;line-height:1.7}
.gate a{display:inline-block;margin-top:14px;background:var(--p2);color:#fff;border-radius:999px;padding:12px 26px;text-decoration:none;font-weight:700}
#printArea{display:none}
@media print{@page{size:A4;margin:0}
 body{background:#fff}
 body>*:not(#printArea){display:none!important}
 #printArea{display:block}
 #printArea img{width:210mm;height:297mm;display:block}}
</style></head><body>
<div class="app">
  <aside class="panel">
    <h2>상담용 시간표 만들기</h2>
    <p class="cap">학생 이름과 학년을 넣으면 학부모님께 드릴 시간표가 바로 만들어집니다. 이름은 비워도 됩니다.</p>
    <div id="stus"></div>
    <button class="add" id="add">+ 학생 추가</button>
    <label class="sibchk" id="sibwrap"><input type="checkbox" id="sib"> 형제자매입니다 <span>(형제 할인 5% 안내가 함께 들어갑니다)</span></label>
    <button class="go" id="pdf">시간표 확인하기</button>
    <div class="msg" id="msg"></div>
    <div class="dv" id="dv"></div>
    <div class="warn" id="warn"></div>
    <div class="data" id="data"></div>
  </aside>
  <main class="stage" id="stage"><div class="fit" id="fit"><div class="sheet" id="sheet"></div></div></main><div id="shot"></div>
<div class="modal" id="modal"><div class="mbox">
  <h3>학부모님께 드릴 시간표</h3><div class="fn" id="fname"></div>
  <img id="pv" alt="시간표 미리 보기">
  <div class="acts">
    <button class="pr" id="bPrint">인쇄(출력)</button>
    <button id="bSave">PDF로 저장하기</button>
    <button class="kk" id="bKakao">카카오톡으로 보내기</button>
    <button class="bk" id="bBack">← 고치러 돌아가기</button>
  </div>
  <div class="mmsg" id="mmsg"></div>
</div></div>
<div id="printArea"><img id="pimg" alt=""></div>
</div>
<script>
let DATA=null;
const LOGO='/assets/logo_js_gold.png';
const CROWN='/assets/crown_gold.svg';
const GRADES=[[-3,'4세'],[-2,'5세'],[-1,'6세'],[0,'7세'],[1,'초1'],[2,'초2'],[3,'초3'],[4,'초4'],[5,'초5'],[6,'초6'],[7,'중1'],[8,'중2'],[9,'중3'],[10,'고1'],[11,'고2'],[12,'고3']];
const full=g=>g<=0?(g+7)+'세':g<=6?'초등 '+g+'학년':g<=9?'중학교 '+(g-6)+'학년':'고등학교 '+(g-9)+'학년';
const short=g=>g<=0?(g+7)+'세':g<=6?'초등 '+g+'학년':g<=9?'중'+(g-6):'고'+(g-9);
const DN={일:'일요일',월:'월요일',화:'화요일',수:'수요일',목:'목요일',금:'금요일',토:'토요일'};
const DO='월화수목금토일';
const ampm=t=>{const[h,m]=t.split(':').map(Number);return(h<12?'오전 ':'오후 ')+((h%12)||12)+':'+String(m).padStart(2,'0');};
const range=(s,e)=>{const a=ampm(s),b=ampm(e);return a.slice(0,2)===b.slice(0,2)?a+'–'+b.slice(3):a+'–'+b;};
const ST={ok:['ok','등록 가능'],soon:['soon','마감 임박'],full:['full','마감 · 대기 접수'],new:['new','신규 모집']};
const tname=t=>!t?'상담 때 안내':t==='장화연'?'장화연 원장':t+' 선생님';
// 학년 기준: 3/1부터 다음 학년도
const now=new Date();const kst=new Date(now.getTime()+9*3600e3);
const ay=(kst.getUTCMonth()+1)>=3?kst.getUTCFullYear():kst.getUTCFullYear()-1;
const stale=false;
function options(g){
  const rows=[];
  DATA.classes.forEach(c=>{if(c.g.includes(g))rows.push({d:c.d,s:c.s,time:DN[c.d]+' '+ampm(c.s),t:c.t,st:c.st,sop:c.sop,kind:'reg',n:c.n,cap:c.cap,mix:c.mix,wait:c.wait,ros:c.ros});});
  DATA.spots.forEach(o=>{const gg=o.hg?o.g:o.g.map(v=>v-(2027-DATA.year));if(!gg.includes(g))return;if(o.until&&kst.toISOString().slice(0,10)>o.until)return;
    rows.push({d:o.d,s:o.s,time:DN[o.d]+' '+range(o.s,o.e),t:o.t,st:'new',kind:o.hg?'hg':'new',label:o.label,cap:o.cap,wait:o.wait});});
  const k=r=>DO.indexOf(r.d)*10000+(+r.s.replace(':',''));
  rows.sort((a,b)=>k(a)-k(b));return rows;
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let stus=[{n:'',g:0}];let sibOn=false;
try{const s=JSON.parse(localStorage.getItem('js-consult')||'null');if(Array.isArray(s)&&s.length)stus=s;sibOn=localStorage.getItem('js-consult-sib')==='1';}catch(e){}
const GROUPS=[['유아',[-3,-2,-1,0]],['초등',[1,2,3,4,5,6]],['중등',[7,8,9]],['고등',[10,11,12]]];
const lab=v=>GRADES.find(x=>x[0]===v)[1];
function drawForm(){
  const box=document.getElementById('stus');box.innerHTML='';
  stus.forEach((s,i)=>{const d=document.createElement('div');d.className='stu';
    d.innerHTML=`<div class="top"><input placeholder="학생 ${i+1} 이름 (선택)" value="${esc(s.n)}" maxlength="10"><button class="x" title="빼기"${stus.length<2?' style="visibility:hidden"':''}>×</button></div>`+GROUPS.map(([gl,vs])=>`<div class="grp"><div class="gl">${gl}</div><div class="chips">${vs.map(v=>`<button class="chip${v===s.g?' on':''}" data-v="${v}">${lab(v)}</button>`).join('')}</div></div>`).join('');
    d.querySelector('input').oninput=e=>{s.n=e.target.value.trim();render();};
    d.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{s.g=+c.dataset.v;d.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===c));render();});
    d.querySelector('.x').onclick=()=>{stus.splice(i,1);drawForm();render();};
    box.appendChild(d);});
  document.getElementById('add').style.display=stus.length>=3?'none':'block';
  document.getElementById('sibwrap').style.display=stus.length>=2?'block':'none';
  document.getElementById('sib').checked=sibOn;
}
function fit(){const st=document.getElementById('stage'),sh=document.getElementById('sheet'),fw=document.getElementById('fit');
  const sc=Math.min(1,st.clientWidth/794);sh.style.transform=sc<1?`scale(${sc})`:'';fw.style.width=(794*sc)+'px';fw.style.height=(sh.offsetHeight*sc)+'px';}
window.addEventListener('resize',fit);
document.getElementById('sib').onchange=e=>{sibOn=e.target.checked;render();};
document.getElementById('add').onclick=()=>{stus.push({n:'',g:stus[stus.length-1].g});drawForm();render();};
function sibling(){
  if(stus.length<2)return null;
  const avail=s=>options(s.g).filter(r=>r.st!=='full'&&r.kind!=='hg');
  const per=stus.map(avail);let best=null;
  for(const d of DO){const pick=[];let ok=true,score=0;const used=new Set();
    per.forEach((list,i)=>{const c=list.filter(r=>r.d===d);if(!c.length){ok=false;return;}
      const sameGrade=stus.findIndex(x=>x.g===stus[i].g);let r=c[0];
      // 같은 학년 두 아이는 같은 반, 다른 학년은 겹치지 않는 시간을 먼저
      if(sameGrade!==i)r=pick[sameGrade].r;else{const free=c.filter(x=>!used.has(x.s));r=(free.length?free:c)[0];}
      used.add(r.s);pick.push({s:stus[i],r});score+=r.st==='ok'?2:1;});
    if(!ok)continue;const ss=[...new Set(pick.map(p=>p.r.s))].length;score+=ss>1?1:0;
    if(!best||score>best.score)best={d,pick,score};}
  return best;
}
function render(){
  try{localStorage.setItem('js-consult',JSON.stringify(stus));localStorage.setItem('js-consult-sib',sibOn?'1':'0');}catch(e){}
  const isSib=sibOn&&stus.length>=2;
  const gs=[...new Set(stus.map(s=>s.g))].sort((a,b)=>a-b);
  const named=stus.filter(s=>s.n);
  const title='주니어솔로몬 '+gs.map(short).join(' · ')+' 수업 시간표';
  const who=named.length?named.map(s=>`${esc(s.n)}(${short(s.g)})`).join(' · ')+' 학부모님께':'';
  let h=`<div class="s-top"><div class="s-reg">주니어솔로몬학원 · 중부교육지원청 제3336호</div><img class="s-logo" src="${LOGO}" alt="주니어솔로몬"><div class="s-h1">${title}</div>${who?`<div class="s-who">${who}</div>`:''}<div class="s-sub">${DATA.label} · ${DATA.asof} 현재</div></div><div class="s-wrap">`;
  let hgShown=false;
  gs.forEach(g=>{const rows=options(g);const reg=rows.filter(r=>r.kind==='reg'),nw=rows.filter(r=>r.kind==='new'),hg=rows.filter(r=>r.kind==='hg');
    const nxt=g<6?`3월부터 ${short(g+1)} 반으로 이어집니다`:g===6?'':'';
    const sop=reg.some(r=>r.sop)?'소포스에듀 수업':'';
    h+=`<div class="s-sec"><div class="s-h2"><span class="t">${full(g)}</span><span class="s">${g<=5?nxt:sop}</span></div>`;
    if(!reg.length&&!nw.length){h+=`<div class="s-empty">지금 열려 있는 반이 없습니다. 상담 후 새 반 개설과 대기 순서를 안내해 드립니다.</div>`;}
    else{h+=`<table class="s-tb"><tr><th class="c1">요일 · 시간</th><th class="c2">담임</th><th>안내</th></tr>`;
      reg.forEach(r=>h+=`<tr><td>${r.time}</td><td>${tname(r.t)}</td><td><span class="bd ${ST[r.st][0]}">${ST[r.st][1]}</span></td></tr>`);
      if(nw.length){if(reg.length)h+=`<tr class="sep"><td colspan="3">새로 시작하는 반</td></tr>`;nw.forEach(r=>h+=`<tr><td>${r.time}</td><td>${tname(r.t)}</td><td><span class="bd new">신규 모집</span></td></tr>`);}
      h+=`</table>`;}
    h+=`</div>`;
    if(hg.length&&!hgShown)hgShown=hg;});
