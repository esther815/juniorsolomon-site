(function(){

  var EVENTS=(window.JS_DATA&&window.JS_DATA.events)||[];
  function today(){ var d=new Date(Date.now()+9*3600e3); return d.toISOString().slice(0,10) }
  function hidden(id){ try{ return localStorage.getItem('jsp_hide_'+id)===today() }catch(e){ return false } }
  var list=EVENTS.filter(function(e){ return today()<=e.until && !hidden(e.id) });
  if(!list.length) return;
  function build(){
