name: build-android
on:
  push:
    paths: ["android-app/twa-manifest.json", ".github/workflows/build-android.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Bubblewrap
        run: |
          npm i -g @bubblewrap/cli@1.27.0
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json
          cd android-app
          yes | bubblewrap update --skipVersionUpgrade --manifest=./twa-manifest.json
          ls
      - name: Gradle (서명 없이)
        run: |
          cd android-app
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleRelease
          find . -name "*.aab" -o -name "*.apk" | grep -v intermediates
      - name: 결과물을 app-build 브랜치에 올리기
        run: |
          mkdir /tmp/out
          cp android-app/app/build/outputs/bundle/release/*.aab /tmp/out/app-release-unsigned.aab
          cp android-app/app/build/outputs/apk/release/*.apk /tmp/out/app-release-unsigned.apk || true
          git config user.name esther815; git config user.email esther815@users.noreply.github.com
          git fetch origin app-build || true
          git checkout --orphan app-build-tmp
          git rm -rf --cached . >/dev/null
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/out/* .
          echo "build $GITHUB_SHA" > BUILD.txt
          git add -A && git commit -m "Android build ${GITHUB_SHA::7}"
          git push -f origin HEAD:app-build
