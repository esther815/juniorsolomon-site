# admin_class_board 함수 정의 확인(읽기 전용, 1회성) — Actions에서 수동 실행
# 목적: 반현황(원장반현황) 수치가 me_students 중복 정리로 영향받는지 확인
# 필요한 비밀값: SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_ID (기존과 동일)
# 이 워크플로는 supabase/sql/99b_diag_class_board_함수확인.sql 한 파일만 읽기 전용으로 실행한다.
name: diag-class-board
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: 실행 도구 준비
        run: |
          cat > /tmp/q.py <<'PY'
          import json, os, urllib.request
          sql = open("supabase/sql/99b_diag_class_board_함수확인.sql", encoding="utf8").read()
          req = urllib.request.Request(
              f"https://api.supabase.com/v1/projects/{os.environ['REF']}/database/query",
              data=json.dumps({"query": sql}).encode(), method="POST",
              headers={"Authorization": f"Bearer {os.environ['TOKEN']}", "Content-Type": "application/json"})
          try:
              out = urllib.request.urlopen(req, timeout=120).read().decode()
          except urllib.error.HTTPError as e:
              print("실패:", e.code, e.read().decode()[:4000]); raise SystemExit(1)
          print(out)
          PY
      - name: admin_class_board 함수 정의 확인
        run: python3 /tmp/q.py
