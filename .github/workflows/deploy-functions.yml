name: Deploy Supabase Edge Functions

# supabase/functions/** 안의 파일이 바뀌어 main에 올라가면 자동으로 전체 함수를 배포합니다.
# 필요한 저장소 비밀(GitHub Secrets, 1회 등록):
#   SUPABASE_ACCESS_TOKEN  — Supabase 대시보드 > Account > Access Tokens에서 발급
#   SUPABASE_PROJECT_ID    — gyuuimwalbxsocnamtqk (juniorsolomon 프로젝트 ref)
# 두 값 모두 이 파일이나 코드에는 넣지 않고, GitHub 저장소 Settings > Secrets and variables > Actions 에서만 등록합니다.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy all functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID" --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
