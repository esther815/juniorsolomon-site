name: supabase-keepalive
on:
  schedule:
    - cron: "17 0 * * *"     # 매일 09:17 KST (무료 요금제 7일 미사용 잠김 방지)
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "https://gyuuimwalbxsocnamtqk.supabase.co/rest/v1/rpc/is_admin" \
            -H "apikey: sb_publishable_Kj2bX4fe9CRSkhvGzBbaJw_y1ZqkjOz" \
            -H "Content-Type: application/json" -d '{}')
          echo "status $code"
          test "$code" = "200"
