<style>
*{box-sizing:border-box}
body{margin:0;background:#FFFFFF;font-family:'Noto Sans KR',sans-serif;color:#1E1A22;word-break:keep-all}
.wrap{max-width:480px;margin:0 auto;padding:56px 24px 80px}
.logo{display:block;width:72px;height:72px;border-radius:18px;margin:0 auto 22px}
h1{font-family:'Noto Serif KR',serif;font-weight:600;font-size:28px;text-align:center;margin:0 0 10px;letter-spacing:-.02em}
.lead{text-align:center;color:#5E5866;font-size:15px;line-height:1.8;margin:0 0 32px}
.kakao{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:54px;border:0;border-radius:12px;background:#FEE500;color:#191919;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer}

.note{margin:18px 0 0;font-size:13px;line-height:1.75;color:#8A8290;text-align:center}
.note a,.chk a{color:#5F3D66}
.card{border:1px solid #EEEAF0;border-radius:18px;padding:24px;margin-top:8px}
.badge{display:inline-block;padding:6px 12px;border-radius:999px;background:#F3ECF6;color:#5F3D66;font-size:13px;font-weight:700}
.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid #F2EEF4;font-size:14px}
.row:first-of-type{border-top:0}
.row span:first-child{color:#8A8290}
.ok{color:#2E7D52;font-weight:700}.no{color:#B9573A;font-weight:700}
.ghost{display:block;width:100%;min-height:48px;margin-top:18px;border:1px solid #CFC8D4;border-radius:12px;background:#fff;color:#1E1A22;font-size:15px;font-family:inherit;cursor:pointer}
.home{display:block;text-align:center;margin-top:28px;font-size:14px;color:#5F3D66;text-decoration:none}
.err{margin-top:16px;padding:14px 16px;border-radius:12px;background:#FBEDE8;color:#8C3A22;font-size:14px;line-height:1.7}
.f{display:block;margin-top:14px;font-size:14px;color:#5E5866}
.f input,.f select{display:block;width:100%;margin-top:6px;min-height:48px;padding:0 14px;border:1px solid #CFC8D4;border-radius:10px;font-size:16px;font-family:inherit;background:#fff}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:16px;font-size:13px;line-height:1.7;color:#5E5866}
.chk input{margin-top:4px;width:18px;height:18px;flex:none}
.primary{display:block;width:100%;min-height:52px;margin-top:20px;border:0;border-radius:12px;background:#5F3D66;color:#fff;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer}
.primary:disabled{opacity:.5}
.m{border:1px solid #EEEAF0;border-radius:14px;padding:16px;margin-top:12px;font-size:14px;line-height:1.7}
.m b{font-size:15px}.m .st{float:right;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:#F3ECF6;color:#5F3D66}
.m .st.approved{background:#E6F3EC;color:#2E7D52}.m .st.rejected{background:#FBEDE8;color:#8C3A22}
.m .act{display:flex;gap:8px;margin-top:10px}.m .act input{flex:1;min-height:40px;border:1px solid #CFC8D4;border-radius:8px;padding:0 10px;font-size:15px}
.m .act button{min-height:40px;padding:0 14px;border-radius:8px;border:0;font-family:inherit;font-weight:700;cursor:pointer}
.okb{background:#5F3D66;color:#fff}.nob{background:#F2EEF4;color:#5E5866}
h2{font-family:'Noto Serif KR',serif;font-weight:600;font-size:20px;margin:36px 0 4px}
.me h2{margin-top:36px}.me .row2{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #F1EDF3;font-size:14px}
.me .row2 b{font-weight:600}.me .stg{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.stg.ok{background:#E6F3EC;color:#2E7D52}.stg.soon{background:#FBF1DE;color:#8A5A12}.stg.full{background:#EEEAF0;color:#5E5866}
.me .alert{background:#FBEDE8;color:#8C3A22;border-radius:12px;padding:12px 14px;font-size:14px;margin-top:10px;line-height:1.6}
.me .okline{background:#E6F3EC;color:#2E7D52;border-radius:12px;padding:12px 14px;font-size:14px;margin-top:10px}
.me .up{border:1px dashed #CFC8D4;border-radius:14px;padding:16px;margin-top:12px;font-size:14px;line-height:1.7}
.me .up input{display:block;margin:6px 0 12px;font-size:14px;max-width:100%}
</style>
<style>@media (hover:hover) and (pointer:fine){html,body{cursor:url("assets/cursor.svg") 3 2, auto}a,button,summary,label,[role="button"],.js-login{cursor:url("assets/cursor-gold.svg") 4 3, pointer}}</style>

<body>
<main class="wrap">
  <img class="logo" src="assets/icon-192.png" alt="주니어솔로몬 왕관">
  <div id="out">
    <h1>주니어솔로몬 회원</h1>
    <p style="margin:0 0 6px;font-family:'Noto Serif KR',serif;font-size:17px;color:#5F3D66">무엇을 구하겠느냐 — 지혜는 질문에서 시작됩니다</p>
    <p class="lead">재원생 학부모님은 카카오로 한 번에 가입하고<br>로그인합니다.</p>
    <button class="kakao" id="login" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#191919" d="M12 3C6.48 3 2 6.58 2 11c0 2.85 1.86 5.35 4.66 6.77l-.95 3.48c-.08.31.27.56.54.38l4.16-2.76c.52.06 1.05.1 1.59.1 5.52 0 10-3.58 10-8S17.52 3 12 3z"/></svg>카카오로 시작하기</button>
    <p class="note">가입하면 원장님 확인 후 재원생 정보가 열립니다.<br><a href="privacy.html">개인정보처리방침</a></p>
  </div>

</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  var sb = window.supabase.createClient(
    'https://gyuuimwalbxsocnamtqk.supabase.co',
    'sb_publishable_Kj2bX4fe9CRSkhvGzBbaJw_y1ZqkjOz'
  );
  var out=document.getElementById('out'), msg=document.getElementById('msg');
  function okBirth(v){ if(!/^(19|20)\d{6}$/.test(v)) return false; var y=+v.slice(0,4),m=+v.slice(4,6),d=+v.slice(6); var t=new Date(y,m-1,d); var now=new Date(); return t.getFullYear()===y&&t.getMonth()===m-1&&t.getDate()===d&&t<now&&y>=now.getFullYear()-25; }
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function err(t){msg.innerHTML='<div class="err">'+esc(t)+'</div>'}

  var q=new URLSearchParams(location.search), h=new URLSearchParams(location.hash.slice(1));
  var e=q.get('error_description')||h.get('error_description');
  if(e) err('로그인이 끝나지 않았습니다: '+e);

  document.getElementById('login').addEventListener('click',function(){
    sb.auth.signInWithOAuth({provider:'kakao',options:{redirectTo:location.origin+'/member.html'}})
      .then(function(r){ if(r.error) err(r.error.message) });
  });

  function logoutBtn(){ return '<button class="ghost" id="logout" type="button">로그아웃</button>' }
  function bindLogout(){ var b=document.getElementById('logout'); if(b) b.addEventListener('click',function(){ sb.auth.signOut().then(function(){location.replace('member.html')}) }) }
  try{ var _t=new URLSearchParams(location.search).get('t'); if(_t){ localStorage.setItem('js_teacher_code',_t) } }catch(e){}
  try{ var _q=new URLSearchParams(location.search); if(_q.get('state')==='kakao_alert'&&_q.get('code')){ sessionStorage.setItem('js_kakao_code',_q.get('code')) } }catch(e){}
  function kakaoFn(body){ return sb.functions.invoke('kakao-alert',{body:body}) }
  function teacherCode(){ try{ return localStorage.getItem('js_teacher_code')||'' }catch(e){ return '' } }
  var shown=false;
  function show(user){
    if(shown) return; shown=true; myId=user.id; history.replaceState(null,'','member.html');
    sb.from('profiles').select('*').eq('id',user.id).maybeSingle().then(function(r){
      var p=r.data;
      if(r.error||!p){ out.innerHTML='<h1>잠시만요</h1><p class="lead">회원 정보를 준비하고 있습니다.<br>잠시 뒤 다시 열어 주세요.</p>'+logoutBtn(); bindLogout(); return }
      var nick=esc(p.nickname||'회원');
      if(!p.phone){
        return sb.rpc('is_admin').then(function(a){
          if(a.data===true){ out.innerHTML='<h1>'+nick+' 원장님</h1><p class="lead"><span class="badge">관리자</span></p><button class="ghost" id="pv" type="button">학부모 가입 화면 미리보기</button><button class="ghost" id="tinv" type="button">강사 초대 링크 만들기</button><div id="tinvm"></div><button class="ghost" id="kak" type="button">카톡 알림 연결 (승인 대기 알림)</button><div id="kakm"></div><div id="me"></div><div id="admin"></div>'+logoutBtn(); bindLogout(); document.getElementById('pv').addEventListener('click',function(){ form(p,'학부모',true) }); document.getElementById('tinv').addEventListener('click',function(){ if(!confirm('새 강사 초대 링크를 만들까요? 이전 링크는 더 이상 쓸 수 없게 됩니다.')) return; sb.rpc('new_teacher_invite').then(function(r){ var m=document.getElementById('tinvm'); if(r.error){ m.innerHTML='<div class="alert" style="background:#FBEDE8;color:#8C3A22;border-radius:12px;padding:12px">만들지 못했습니다.</div>'; return } var url='https://juniorsolomon.com/member.html?t='+r.data; m.innerHTML='<div class="card" style="margin-top:10px;font-size:14px;line-height:1.7"><b>강사 단톡방에 이 링크를 보내 주세요</b><br><span style="word-break:break-all">'+url+'</span><br><button class="primary" id="tcopy" type="button" style="margin-top:10px">링크 복사</button></div>'; document.getElementById('tcopy').onclick=function(){ navigator.clipboard.writeText(url).then(function(){ document.getElementById('tcopy').textContent='복사했습니다' }) } }) }); meBoard(); admin(); kakaoSetup() }
          else if(teacherCode()) teacherForm(p,nick);
          else form(p,nick);
        });
      }
      if(teacherCode() && p.role!=='teacher' && p.status!=='approved') return teacherForm(p,nick);
      var badge={pending:'승인 대기',approved:'승인 완료',rejected:'확인 필요'}[p.status];
      if(p.role==='teacher'){
        out.innerHTML='<h1>'+esc(p.teacher_name||nick)+' 선생님</h1><p class="lead"><span class="badge">'+badge+'</span><br><br>'+
          ({pending:'원장님이 확인하면 선생님 화면이 열립니다.',approved:'내 반 학생 명단·출결 화면은 곧 열립니다.',rejected:'원장님께 문의해 주세요.'}[p.status])+'</p>'+
          '<div class="card"><div class="row"><span>담당</span><span>'+esc(p.teacher_subject||'-')+'</span></div><div class="row"><span>연락처</span><span>'+esc((p.phone||'').replace(/(\d{3})(\d{3,4})(\d{4})/,'$1-$2-$3'))+'</span></div></div>'+installBox()+logoutBtn();
        bindLogout(); bindInstall(); return;
      }
      var txt={pending:'원장님이 확인하면 우리 아이 수업 정보가 열립니다.',approved:'',rejected:'학원으로 연락 주세요. 02-794-8123'}[p.status];
      out.innerHTML='<h1>'+nick+'님</h1><p class="lead"><span class="badge">'+badge+'</span>'+(txt?'<br><br>'+txt:'')+'</p>'+
        '<div id="child"></div><div id="kids"></div>'+
        '<button class="ghost" id="addkid" type="button">자녀 추가 · 정보 고치기</button>'+
        installBox()+'<div id="admin"></div>'+logoutBtn();
      bindLogout(); bindInstall();
      sb.from('children').select('*').eq('parent_id',p.id).order('created_at').then(function(cr){
        var kids=(cr.data||[]); var KST={pending:'승인 대기',approved:'승인',rejected:'확인 필요'};
        document.getElementById('kids').innerHTML='<div class="card">'+kids.map(function(k){ return '<div class="row"><span>'+esc(k.name)+' · '+esc(k.grade||'')+'</span><span>'+esc(k.school||'')+' · '+KST[k.status]+(k.student_no?' · '+esc(k.student_no):'')+'</span></div>' }).join('')+
          '<div class="row"><span>연락처</span><span>'+esc((p.phone||'').replace(/(\d{3})(\d{3,4})(\d{4})/,'$1-$2-$3'))+'</span></div></div>';
        document.getElementById('addkid').onclick=function(){ form(p,nick,false,kids) };
      });
      if(p.status==='approved') childCard();
      sb.rpc('is_admin').then(function(a){ if(a.data===true) admin() });
    });
  }
  var GRADES=['5세','6세','7세','초1','초2','초3','초4','초5','초6','중1','중2','중3','고1','고2','고3'];
  function kidBlock(k,i){
    k=k||{}; var lock=k.status&&k.status!=='pending';
    var g='<option value="">고르세요</option>'+GRADES.map(function(x){ return '<option'+(k.grade===x?' selected':'')+'>'+x+'</option>' }).join('');
    var b=(k.birth||'').replace(/-/g,'');
    return '<div class="card kid" data-id="'+esc(k.id||'')+'" data-lock="'+(lock?1:0)+'" style="margin-top:14px">'+
      '<div style="display:flex;justify-content:space-between;align-items:center"><b class="kt">자녀 '+(i+1)+'</b>'+(lock?'<span style="font-size:13px;color:#2E7D52">승인됨 · 휴대폰만 고칠 수 있어요</span>':'<button type="button" class="kdel" style="border:0;background:none;color:#8C3A22;font-size:14px;font-family:inherit">빼기</button>')+'</div>'+
      '<label class="f">이름<input class="kn" autocomplete="off" value="'+esc(k.name||'')+'"'+(lock?' disabled':'')+'></label>'+
      '<label class="f">생년월일 <span style="color:#8A8290">(8자리 숫자)</span><input class="kb" inputmode="numeric" maxlength="8" placeholder="20170811" value="'+esc(b)+'"'+(lock?' disabled':'')+'></label>'+
      '<label class="f">학년 <span style="color:#8A8290">(지금 학년)</span><select class="kg"'+(lock?' disabled':'')+'>'+g+'</select></label>'+
      '<label class="f">학교(유치원)<input class="ks" autocomplete="off" value="'+esc(k.school||'')+'"'+(lock?' disabled':'')+'></label>'+
      '<label class="f">자녀 휴대폰 번호 <span style="color:#8A8290">(있으면 · 지각·결석 시 바로 연락)</span><input class="kp" inputmode="numeric" placeholder="01012345678" value="'+esc(k.student_phone||'')+'"></label></div>';
  }
  function form(p,nick,preview,kids){
    kids=(kids&&kids.length)?kids:[{}];
    var again=!!(kids[0]&&kids[0].id);
    out.innerHTML='<h1>'+nick+'님, '+(again?'자녀 정보':'반갑습니다')+'</h1><p class="lead">'+(again?'자녀를 더하거나 승인 전 정보를 고칠 수 있습니다.<br>새로 더한 자녀는 원장님 확인 뒤 열립니다.':'한 번만 입력하면 됩니다.<br>자녀가 여럿이면 아래 「자녀 더하기」를 눌러 주세요.')+'</p>'+
      '<label class="f">학부모 휴대폰 번호<input id="ph" inputmode="numeric" autocomplete="tel" placeholder="01012345678" value="'+esc(p.phone||'')+'"></label>'+
      '<div id="kidl">'+kids.map(kidBlock).join('')+'</div>'+
      '<button class="ghost" id="kadd" type="button">＋ 자녀 더하기</button>'+
      '<label class="chk"><input type="checkbox" id="ag"><span>저는 위 자녀의 법정대리인(보호자)이며, 자녀의 이름·생년월일·학년·학교·휴대폰 번호를 학원의 재원생 확인, 수업 정보 제공, 지각·결석 시 연락에 쓰는 것에 동의합니다. <a href="privacy.html">개인정보처리방침</a></span></label>'+
      '<button class="primary" id="save" type="button">저장하고 승인 요청하기</button>'+(preview?'<button class="ghost" id="back" type="button">원장님 화면으로 돌아가기</button>':(again?'<button class="ghost" id="back" type="button">돌아가기</button>':logoutBtn()));
    var back=function(){ shown=false; sb.auth.getUser().then(function(u){ show(u.data.user) }) };
    if(preview){ out.insertAdjacentHTML('afterbegin','<div class="err" style="background:#FBF4E2;color:#7A5A12;border-color:#E8D5A0">미리보기입니다. 저장되지 않으니 마음껏 눌러 보세요.</div>'); document.getElementById('back').addEventListener('click',back) }
    else if(again) document.getElementById('back').addEventListener('click',back); else bindLogout();
    var list=document.getElementById('kidl');
    var renum=function(){ var ks=list.querySelectorAll('.kid'); ks.forEach(function(el,i){ el.querySelector('.kt').textContent='자녀 '+(i+1) }); document.getElementById('kadd').style.display=ks.length>=5?'none':'block' };
    list.addEventListener('click',function(e){ if(e.target.classList.contains('kdel')){ if(list.querySelectorAll('.kid').length<=1) return err('자녀는 한 명 이상 있어야 합니다.'); e.target.closest('.kid').remove(); renum() } });
    document.getElementById('kadd').addEventListener('click',function(){ list.insertAdjacentHTML('beforeend',kidBlock({},list.querySelectorAll('.kid').length)); renum() });
    renum();
    document.getElementById('save').addEventListener('click',function(){
      var ph=document.getElementById('ph').value.replace(/\D/g,''), items=[], bad='';
      msg.innerHTML='';
      if(!/^01\d{8,9}$/.test(ph)) return err('학부모 휴대폰 번호를 숫자만 정확히 적어 주세요.');
      list.querySelectorAll('.kid').forEach(function(el,i){
        if(bad) return;
        var n=el.querySelector('.kn').value.trim(), b=el.querySelector('.kb').value.replace(/\D/g,''), g=el.querySelector('.kg').value, sc=el.querySelector('.ks').value.trim(), sp=el.querySelector('.kp').value.replace(/\D/g,'');
        var who='자녀 '+(i+1)+': ';
        if(!n||!g||!sc) bad=who+'이름, 학년, 학교를 모두 적어 주세요.';
        else if(!okBirth(b)) bad=who+'생년월일을 8자리 숫자로 정확히 적어 주세요. 예: 20170811';
        else if(sp&&!/^01\d{8,9}$/.test(sp)) bad=who+'휴대폰 번호를 숫자만 정확히 적어 주세요. 없으면 비워 두세요.';
        items.push({id:el.getAttribute('data-id')||null,name:n,grade:g,school:sc,birth:b.slice(0,4)+'-'+b.slice(4,6)+'-'+b.slice(6),student_phone:sp||null});
      });
      if(bad) return err(bad);
      if(!document.getElementById('ag').checked) return err('보호자 동의에 체크해 주세요.');
      if(preview){ msg.innerHTML='<div class="err" style="background:#EAF5EE;color:#2F6B4A;border-color:#BFDCC9">입력 확인 완료 (자녀 '+items.length+'명). 실제 학부모라면 여기서 저장되고 「승인 대기」 화면으로 넘어갑니다.</div>'; return }
      var btn=this; btn.disabled=true;
      sb.rpc('save_my_children',{p_phone:ph,p_items:items}).then(function(r){
        if(r.error){ btn.disabled=false; return err(/5명/.test(r.error.message)?'자녀는 5명까지 적을 수 있습니다.':'저장하지 못했습니다. 다시 눌러 주세요.') }
        back();
      });

  function clean(o){ var n={}; Object.keys(o).forEach(function(k){ n[k.trim()]=typeof o[k]==='string'?o[k].trim():o[k] }); return n }
  function uploadExcel(){
    var m=document.getElementById('upm'), fS=document.getElementById('fS').files[0], fC=document.getElementById('fC').files[0];
    if(!fS||!fC){ m.innerHTML='<div class="alert">두 파일을 모두 골라 주세요.</div>'; return }
    m.textContent='읽는 중…';
    loadXLSX().then(function(){ return Promise.all([readRows(fS),readRows(fC)]) }).then(function(r){
      var S=[],E=[],C=[], rs=r[0].map(clean), rc=r[1].map(clean);
      if(!rs.length||!('원생고유번호' in rs[0])) throw new Error('① 파일이 원생 전체 목록이 아닙니다. (원생고유번호 칸이 없음)');
      if(!rc.length||!('수업명' in rc[0])) throw new Error('② 파일이 수업 목록이 아닙니다. (수업명 칸이 없음)');
      rs.forEach(function(x){
        var st=x['재원여부']==='O'&&x['휴원여부']!=='O'?'재원':(x['휴원여부']==='O'?'휴원':'퇴원');
        S.push({me_id:String(x['원생고유번호']),name:x['이름'],school:x['학교'],grade:x['학년'],status:st,birth:String(x['생일']||''),guardian_phone:x['보호자연락처'],joined_on:String(x['입학일']||''),left_on:String(x['퇴원일']||'')});
        if(st!=='퇴원') String(x['수업']||'').split(',').map(function(c){return c.trim()}).filter(Boolean).forEach(function(c){ E.push({class_id:c,student_id:String(x['원생고유번호'])}) });
      });
      rc.forEach(function(c){ C.push({me_id:c['수업명'],name:c['수업명'],teacher:c['담임강사'],cap:String(c['정원']||'').replace(/\.0+$/,''),target:c['대상']}) });
      m.textContent='반영하는 중… (원생 '+S.length+'명, 수업 '+C.length+'개)';
      return sb.rpc('apply_snapshot',{p_source:'excel',p_students:S,p_classes:C,p_enrollments:E});
    }).then(function(res){
      if(res.error) throw new Error(res.error.message);

    }).catch(function(e){ m.innerHTML='<div class="alert">올리지 못했습니다. '+esc(e.message||String(e))+'</div>'; sb.rpc('log_sync_error',{p_source:'excel',p_error:String(e.message||e)}) });
  }

          var badge=m.status==='approved'&&wait.length?'자녀 추가 대기':st;
          return '<div class="m"><span class="st '+(wait.length?'pending':m.status)+'">'+badge+'</span><b>보호자 '+esc(m.nickname||'')+'</b> · '+(m.phone?fmt(m.phone):'번호 미입력')+' · 자녀 '+ks.length+'명'+
            ks.map(function(k){ return '<div style="margin-top:8px;padding-top:8px;border-top:1px dashed #E4DEE8"><b>'+esc(k.name)+'</b> '+esc(k.grade||'')+' · '+esc(k.school||'')+(k.birth?' · '+esc(k.birth.replace(/-/g,'')):'')+' · '+KST[k.status]+(k.student_no?' · '+esc(k.student_no):'')+(k.student_phone?'<br>학생 '+fmt(k.student_phone):'')+(k.status!=='approved'?'<div style="font-size:13px;margin-top:4px">'+why(k)+'</div>':'')+'</div>' }).join('')+
            (wait.length&&m.phone?'<div class="act"><button class="okb" data-ok="'+m.id+'" style="flex:1">승인 (자녀 '+wait.length+'명 원생번호 자동 부여)</button>'+(m.status!=='approved'?'<button class="nob" data-no="'+m.id+'">반려</button>':'')+'</div>':'')+'</div>';
        }).join('');
      box.onclick=function(e){
        var ok=e.target.getAttribute('data-ok'), no=e.target.getAttribute('data-no');
        if(ok){ e.target.disabled=true; sb.rpc('approve_member',{target:ok}).then(function(res){ if(res.error){ e.target.disabled=false; alert('승인하지 못했습니다. 다시 눌러 주세요.'); return } admin() }) }
        if(no&&confirm('반려할까요?')){ sb.rpc('reject_member',{target:no}).then(admin) }
      };
    });
  }
  sb.auth.getSession().then(function(r){ var s=r.data&&r.data.session; if(s) show(s.user) });
  sb.auth.onAuthStateChange(function(ev,s){ if(s&&s.user) show(s.user) });
})();
</script>
<script>if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}) }</script>
</body>
