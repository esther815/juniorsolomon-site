<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>회원 | 주니어솔로몬학원</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="theme-color" content="#2B1233">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#FFFFFF;font-family:'Noto Sans KR',sans-serif;color:#1E1A22;word-break:keep-all}
.wrap{max-width:480px;margin:0 auto;padding:56px 24px 80px}
.logo{display:block;width:72px;height:72px;border-radius:18px;margin:0 auto 22px}
h1{font-family:'Noto Serif KR',serif;font-weight:600;font-size:28px;text-align:center;margin:0 0 10px;letter-spacing:-.02em}
.lead{text-align:center;color:#5E5866;font-size:15px;line-height:1.8;margin:0 0 32px}
.kakao{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:54px;border:0;border-radius:12px;background:#FEE500;color:#191919;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer}
.kakao svg{width:20px;height:20px}
.note{margin:18px 0 0;font-size:13px;line-height:1.75;color:#8A8290;text-align:center}
.note a,.chk a{color:#5F3D66}
.card{border:1px solid #EEEAF0;border-radius:18px;padding:24px;margin-top:8px}
.badge{display:inline-block;padding:6px 12px;border-radius:999px;background:#F3ECF6;color:#5F3D66;font-size:13px;font-weight:700}
.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid #F2EEF4;font-size:14px}
.row:first-of-type{border-top:0}
.row span:first-child{color:#8A8290}
.ok{color:#2E7D52;font-weight:700}.no{color:#B9573A;font-weight:700}
.ghost{display:block;width:100%;min-height:48px;margin-top:18px;border:1px solid #CFC8D4;border-radius:12px;background:#fff;color:#1E1A22;font-size:15px;font-family:inherit;cursor:pointer}
.home{display:block;text-align:center;margin-top:28px;font-size:14px;color:#5F3D66;text-decoration:none}
.err{margin-top:16px;padding:14px 16px;border-radius:12px;background:#FBEDE8;color:#8C3A22;font-size:14px;line-height:1.7}
.f{display:block;margin-top:14px;font-size:14px;color:#5E5866}
.f input,.f select{display:block;width:100%;margin-top:6px;min-height:48px;padding:0 14px;border:1px solid #CFC8D4;border-radius:10px;font-size:16px;font-family:inherit;background:#fff}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:16px;font-size:13px;line-height:1.7;color:#5E5866}
.chk input{margin-top:4px;width:18px;height:18px;flex:none}
.primary{display:block;width:100%;min-height:52px;margin-top:20px;border:0;border-radius:12px;background:#5F3D66;color:#fff;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer}
.primary:disabled{opacity:.5}
.m{border:1px solid #EEEAF0;border-radius:14px;padding:16px;margin-top:12px;font-size:14px;line-height:1.7}
.m b{font-size:15px}.m .st{float:right;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:#F3ECF6;color:#5F3D66}
.m .st.approved{background:#E6F3EC;color:#2E7D52}.m .st.rejected{background:#FBEDE8;color:#8C3A22}
.m .act{display:flex;gap:8px;margin-top:10px}.m .act input{flex:1;min-height:40px;border:1px solid #CFC8D4;border-radius:8px;padding:0 10px;font-size:15px}
.m .act button{min-height:40px;padding:0 14px;border-radius:8px;border:0;font-family:inherit;font-weight:700;cursor:pointer}
.okb{background:#5F3D66;color:#fff}.nob{background:#F2EEF4;color:#5E5866}
h2{font-family:'Noto Serif KR',serif;font-weight:600;font-size:20px;margin:36px 0 4px}
</style>
</head>
<body>
<main class="wrap">
  <img class="logo" src="assets/icon-192.png" alt="주니어솔로몬 왕관">
  <div id="out">
    <h1>주니어솔로몬 회원</h1>
    <p class="lead">재원생 학부모님은 카카오로 한 번에 가입하고<br>로그인합니다.</p>
    <button class="kakao" id="login" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#191919" d="M12 3C6.48 3 2 6.58 2 11c0 2.85 1.86 5.35 4.66 6.77l-.95 3.48c-.08.31.27.56.54.38l4.16-2.76c.52.06 1.05.1 1.59.1 5.52 0 10-3.58 10-8S17.52 3 12 3z"/></svg>카카오로 시작하기</button>
    <p class="note">가입하면 원장님 확인 후 재원생 정보가 열립니다.<br><a href="privacy.html">개인정보처리방침</a></p>
  </div>
  <div id="msg"></div>
  <a class="home" href="index.html">← 홈페이지로</a>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  var sb = window.supabase.createClient(
    'https://gyuuimwalbxsocnamtqk.supabase.co',
    'sb_publishable_Kj2bX4fe9CRSkhvGzBbaJw_y1ZqkjOz'
  );
  var out=document.getElementById('out'), msg=document.getElementById('msg');
  function okBirth(v){ if(!/^(19|20)\d{6}$/.test(v)) return false; var y=+v.slice(0,4),m=+v.slice(4,6),d=+v.slice(6); var t=new Date(y,m-1,d); var now=new Date(); return t.getFullYear()===y&&t.getMonth()===m-1&&t.getDate()===d&&t<now&&y>=now.getFullYear()-25; }
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function err(t){msg.innerHTML='<div class="err">'+esc(t)+'</div>'}

  var q=new URLSearchParams(location.search), h=new URLSearchParams(location.hash.slice(1));
  var e=q.get('error_description')||h.get('error_description');
  if(e) err('로그인이 끝나지 않았습니다: '+e);

  document.getElementById('login').addEventListener('click',function(){
    sb.auth.signInWithOAuth({provider:'kakao',options:{redirectTo:location.origin+'/member.html'}})
      .then(function(r){ if(r.error) err(r.error.message) });
  });

  function logoutBtn(){ return '<button class="ghost" id="logout" type="button">로그아웃</button>' }
  function bindLogout(){ var b=document.getElementById('logout'); if(b) b.addEventListener('click',function(){ sb.auth.signOut().then(function(){location.replace('member.html')}) }) }
  var shown=false;
  function show(user){
    if(shown) return; shown=true; myId=user.id; history.replaceState(null,'','member.html');
    sb.from('profiles').select('*').eq('id',user.id).maybeSingle().then(function(r){
      var p=r.data;
      if(r.error||!p){ out.innerHTML='<h1>잠시만요</h1><p class="lead">회원 정보를 준비하고 있습니다.<br>잠시 뒤 다시 열어 주세요.</p>'+logoutBtn(); bindLogout(); return }
      var nick=esc(p.nickname||'회원');
      if(!p.phone){
        return sb.rpc('is_admin').then(function(a){
          if(a.data===true){ out.innerHTML='<h1>'+nick+' 원장님</h1><p class="lead"><span class="badge">관리자</span></p><button class="ghost" id="pv" type="button">학부모 가입 화면 미리보기</button><div id="admin"></div>'+logoutBtn(); bindLogout(); document.getElementById('pv').addEventListener('click',function(){ form(p,'학부모',true) }); admin() }
          else form(p,nick);
        });
      }
      var badge={pending:'승인 대기',approved:'승인 완료',rejected:'확인 필요'}[p.status];
      var txt={pending:'원장님이 확인하면 재원생 정보가 열립니다.',approved:(p.student_no?'원생번호 '+esc(p.student_no):'재원생 정보가 열렸습니다.'),rejected:'학원으로 연락 주세요. 02-794-8123'}[p.status];
      out.innerHTML='<h1>'+nick+'님</h1><p class="lead"><span class="badge">'+badge+'</span><br><br>'+txt+'</p>'+
        '<div class="card"><div class="row"><span>자녀</span><span>'+esc(p.child_name)+' · '+esc(p.child_grade)+'</span></div><div class="row"><span>학교</span><span>'+esc(p.child_school)+'</span></div><div class="row"><span>연락처</span><span>'+esc(p.phone.replace(/(\d{3})(\d{3,4})(\d{4})/,'$1-$2-$3'))+'</span></div></div>'+
        '<div id="admin"></div>'+logoutBtn();
      bindLogout();
      sb.rpc('is_admin').then(function(a){ if(a.data===true) admin() });
    });
  }
  function form(p,nick,preview){
    out.innerHTML='<h1>'+nick+'님, 반갑습니다</h1><p class="lead">한 번만 입력하면 됩니다.<br>원장님이 확인한 뒤 재원생 정보가 열립니다.</p>'+
      '<label class="f">학부모 휴대폰 번호<input id="ph" inputmode="numeric" autocomplete="tel" placeholder="01012345678"></label>'+
      '<label class="f">자녀 이름<input id="cn" autocomplete="off"></label>'+
      '<label class="f">자녀 생년월일 <span style="color:#8A8290">(8자리 숫자)</span><input id="cb" inputmode="numeric" maxlength="8" placeholder="20170811"></label>'+
      '<label class="f">자녀 학년<select id="cg"><option value="">고르세요</option><option>5세</option><option>6세</option><option>7세</option><option>초1</option><option>초2</option><option>초3</option><option>초4</option><option>초5</option><option>초6</option><option>중1</option><option>중2</option><option>중3</option><option>고1</option><option>고2</option><option>고3</option></select></label>'+
      '<label class="f">학교(유치원)<input id="cs" autocomplete="off"></label>'+
      '<label class="f">자녀 휴대폰 번호 <span style="color:#8A8290">(있으면 · 지각·결석 시 바로 연락)</span><input id="sp" inputmode="numeric" placeholder="01012345678"></label>'+
      '<label class="chk"><input type="checkbox" id="ag"><span>저는 이 자녀의 법정대리인(보호자)이며, 자녀의 이름·생년월일·학년·학교·휴대폰 번호를 학원의 재원생 확인, 수업 정보 제공, 지각·결석 시 연락에 쓰는 것에 동의합니다. <a href="privacy.html">개인정보처리방침</a></span></label>'+
      '<button class="primary" id="save" type="button">저장하고 승인 요청하기</button>'+(preview?'<button class="ghost" id="back" type="button">원장님 화면으로 돌아가기</button>':logoutBtn());
    if(preview){ out.insertAdjacentHTML('afterbegin','<div class="err" style="background:#FBF4E2;color:#7A5A12;border-color:#E8D5A0">미리보기입니다. 저장되지 않으니 마음껏 눌러 보세요.</div>'); document.getElementById('back').addEventListener('click',function(){ shown=false; sb.auth.getUser().then(function(u){ show(u.data.user) }) }) } else bindLogout();
    document.getElementById('save').addEventListener('click',function(){
      var ph=document.getElementById('ph').value.replace(/\D/g,''), cn=document.getElementById('cn').value.trim(), cg=document.getElementById('cg').value, cs=document.getElementById('cs').value.trim(), cb=document.getElementById('cb').value.replace(/\D/g,''), sp=document.getElementById('sp').value.replace(/\D/g,'');
      msg.innerHTML='';
      if(!/^01\d{8,9}$/.test(ph)) return err('휴대폰 번호를 숫자만 정확히 적어 주세요.');
      if(!cn||!cg||!cs) return err('자녀 이름, 학년, 학교를 모두 적어 주세요.');
      if(!okBirth(cb)) return err('자녀 생년월일을 8자리 숫자로 정확히 적어 주세요. 예: 20170811');
      if(sp&&!/^01\d{8,9}$/.test(sp)) return err('자녀 휴대폰 번호를 숫자만 정확히 적어 주세요. 없으면 비워 두세요.');
      if(!document.getElementById('ag').checked) return err('보호자 동의에 체크해 주세요.');
      if(preview){ msg.innerHTML='<div class="err" style="background:#EAF5EE;color:#2F6B4A;border-color:#BFDCC9">입력 확인 완료. 실제 학부모라면 여기서 저장되고 「승인 대기」 화면으로 넘어갑니다.</div>'; return }
      this.disabled=true;
      sb.from('profiles').update({phone:ph,child_name:cn,child_grade:cg,child_school:cs,child_birth:cb.slice(0,4)+'-'+cb.slice(4,6)+'-'+cb.slice(6),student_phone:sp||null,guardian_consent_at:new Date().toISOString()}).eq('id',p.id).then(function(r){
        if(r.error){ document.getElementById('save').disabled=false; return err('저장하지 못했습니다. 다시 눌러 주세요.') }
        shown=false; sb.auth.getUser().then(function(u){ show(u.data.user) });
      });
    });
  }
  var myId='';
  function admin(){
    var box=document.getElementById('admin'); box.setAttribute('data-me',myId);
    sb.from('profiles').select('*').order('created_at',{ascending:false}).then(function(r){
      if(r.error) return;
      var me=(box.getAttribute('data-me')||''); var rows=(r.data||[]).filter(function(m){return m.id!==me});
      box.innerHTML='<h2>원장님 화면 · 학부모 회원 '+rows.length+'명</h2>'+(rows.length?'':'<p class="lead" style="text-align:left">아직 가입한 학부모가 없습니다.</p>')+'<p class="lead" style="text-align:left;margin:0">승인 대기 회원을 원생원장과 맞춰 본 뒤 원생번호를 넣고 승인하세요.</p>'+
        rows.map(function(m){
          var st={pending:'승인 대기',approved:'승인',rejected:'반려'}[m.status];
          return '<div class="m"><span class="st '+m.status+'">'+st+'</span><b>'+esc(m.child_name||'(미입력)')+'</b> '+esc(m.child_grade||'')+' · '+esc(m.child_school||'')+(m.child_birth?' · '+esc(m.child_birth.replace(/-/g,'')):'')+
            '<br>보호자 '+esc(m.nickname||'')+' · '+esc((m.phone||'번호 미입력').replace(/(\d{3})(\d{3,4})(\d{4})/,'$1-$2-$3'))+(m.student_phone?'<br>학생 '+esc(m.student_phone.replace(/(\d{3})(\d{3,4})(\d{4})/,'$1-$2-$3')):'')+(m.student_no?' · '+esc(m.student_no):'')+
            (m.status!=='approved'&&m.phone?'<div class="act"><input placeholder="원생번호 JS-0000" data-sno="'+m.id+'"><button class="okb" data-ok="'+m.id+'">승인</button><button class="nob" data-no="'+m.id+'">반려</button></div>':'')+'</div>';
        }).join('');
      box.onclick=function(e){
        var ok=e.target.getAttribute('data-ok'), no=e.target.getAttribute('data-no');
        if(ok){ var s=box.querySelector('[data-sno="'+ok+'"]').value; sb.rpc('approve_member',{target:ok,sno:s}).then(admin) }
        if(no&&confirm('반려할까요?')){ sb.rpc('reject_member',{target:no}).then(admin) }
      };
    });
  }
  sb.auth.getSession().then(function(r){ var s=r.data&&r.data.session; if(s) show(s.user) });
  sb.auth.onAuthStateChange(function(ev,s){ if(s&&s.user) show(s.user) });
})();
</script>
</body>
</html>
