body{margin:0;background:#FFFFFF;font-family:'Noto Sans KR',sans-serif;color:#1E1A22;word-break:keep-all}
.wrap{max-width:480px;margin:0 auto;padding:56px 24px 80px}

.ok{color:#2E7D52;font-weight:700}.no{color:#B9573A;font-weight:700}

.m b{font-size:15px}.m .st{float:right;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:#F3ECF6;color:#5F3D66}
.m .st.approved{background:#E6F3EC;color:#2E7D52}.m .st.rejected{background:#FBEDE8;color:#8C3A22}

h2{font-family:'Noto Serif KR',serif;font-weight:600;font-size:20px;margin:36px 0 4px}
.me h2{margin-top:36px}.me .row2{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #F1EDF3;font-size:14px}

.stg.ok{background:#E6F3EC;color:#2E7D52}.stg.soon{background:#FBF1DE;color:#8A5A12}.stg.full{background:#EEEAF0;color:#5E5866}

.me .okline{background:#E6F3EC;color:#2E7D52;border-radius:12px;padding:12px 14px;font-size:14px;margin-top:10px}
.me .up{border:1px dashed #CFC8D4;border-radius:14px;padding:16px;margin-top:12px;font-size:14px;line-height:1.7}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  var sb = window.supabase.createClient(
    'https://gyuuimwalbxsocnamtqk.supabase.co',

  );
  var out=document.getElementById('out'), msg=document.getElementById('msg');
  function okBirth(v){ if(!/^(19|20)\d{6}$/.test(v)) return false; var y=+v.slice(0,4),m=+v.slice(4,6),d=+v.slice(6); var t=new Date(y,m-1,d); var now=new Date(); return t.getFullYear()===y&&t.getMonth()===m-1&&t.getDate()===d&&t<now&&y>=now.getFullYear()-25; }
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function err(t){msg.innerHTML='<div class="err">'+esc(t)+'</div>'}

          else form(p,nick);
        });
      }
      var badge={pending:'승인 대기',approved:'승인 완료',rejected:'확인 필요'}[p.status];
      var txt={pending:'원장님이 확인하면 재원생 정보가 열립니다.',approved:(p.student_no?'원생번호 '+esc(p.student_no):'재원생 정보가 열렸습니다.'),rejected:'학원으로 연락 주세요. 02-794-8123'}[p.status];
      out.innerHTML='<h1>'+nick+'님</h1><p class="lead"><span class="badge">'+badge+'</span><br><br>'+txt+'</p>'+
        '<div class="card"><div class="row"><span>자녀</span><span>'+esc(p.child_name)+' · '+esc(p.child_grade)+'</span></div><div class="row"><span>학교</span><span>'+esc(p.child_school)+'</span></div><div class="row"><span>연락처</span><span>'+esc(p.phone.replace(/(\d{3})(\d{3,4})(\d{4})/,'$1-$2-$3'))+'</span></div></div>'+
        '<div id="admin"></div>'+logoutBtn();
      bindLogout();
      sb.rpc('is_admin').then(function(a){ if(a.data===true) admin() });
    });
  }
  function form(p,nick,preview){
    out.innerHTML='<h1>'+nick+'님, 반갑습니다</h1><p class="lead">한 번만 입력하면 됩니다.<br>원장님이 확인한 뒤 재원생 정보가 열립니다.</p>'+
      '<label class="f">학부모 휴대폰 번호<input id="ph" inputmode="numeric" autocomplete="tel" placeholder="01012345678"></label>'+
      '<label class="f">자녀 이름<input id="cn" autocomplete="off"></label>'+

      '<label class="f">자녀 학년<select id="cg"><option value="">고르세요</option><option>5세</option><option>6세</option><option>7세</option><option>초1</option><option>초2</option><option>초3</option><option>초4</option><option>초5</option><option>초6</option><option>중1</option><option>중2</option><option>중3</option><option>고1</option><option>고2</option><option>고3</option></select></label>'+
      '<label class="f">학교(유치원)<input id="cs" autocomplete="off"></label>'+
      '<label class="f">자녀 휴대폰 번호 <span style="color:#8A8290">(있으면 · 지각·결석 시 바로 연락)</span><input id="sp" inputmode="numeric" placeholder="01012345678"></label>'+
      '<label class="chk"><input type="checkbox" id="ag"><span>저는 이 자녀의 법정대리인(보호자)이며, 자녀의 이름·생년월일·학년·학교·휴대폰 번호를 학원의 재원생 확인, 수업 정보 제공, 지각·결석 시 연락에 쓰는 것에 동의합니다. <a href="privacy.html">개인정보처리방침</a></span></label>'+
      '<button class="primary" id="save" type="button">저장하고 승인 요청하기</button>'+(preview?'<button class="ghost" id="back" type="button">원장님 화면으로 돌아가기</button>':logoutBtn());
    if(preview){ out.insertAdjacentHTML('afterbegin','<div class="err" style="background:#FBF4E2;color:#7A5A12;border-color:#E8D5A0">미리보기입니다. 저장되지 않으니 마음껏 눌러 보세요.</div>'); document.getElementById('back').addEventListener('click',function(){ shown=false; sb.auth.getUser().then(function(u){ show(u.data.user) }) }) } else bindLogout();
    document.getElementById('save').addEventListener('click',function(){
      var ph=document.getElementById('ph').value.replace(/\D/g,''), cn=document.getElementById('cn').value.trim(), cg=document.getElementById('cg').value, cs=document.getElementById('cs').value.trim(), cb=document.getElementById('cb').value.replace(/\D/g,''), sp=document.getElementById('sp').value.replace(/\D/g,'');
      msg.innerHTML='';

      this.disabled=true;

        shown=false; sb.auth.getUser().then(function(u){ show(u.data.user) });

  var STG={ok:'등록 가능',soon:'마감 임박',full:'대기 접수'};
  var KIND={'신규':'신규 등록','상태':'상태 변경','반 들어감':'반 배정','반 빠짐':'반에서 빠짐','자리 단계':'자리 단계','새 반':'새 반','반 없어짐':'반 없어짐'};
  function ago(t){ var m=Math.round((Date.now()-new Date(t))/60000); if(m<60) return m+'분 전'; if(m<1440) return Math.round(m/60)+'시간 전'; return Math.round(m/1440)+'일 전' }
  function meBoard(){
    var box=document.getElementById('me'); if(!box) return; box.className='me';
    Promise.all([
      sb.from('sync_runs').select('*').order('id',{ascending:false}).limit(1),

      var run=(r[0].data||[])[0], cls=(r[1].data||[]), log=(r[2].data||[]), st=(r[3].data||[]), un=(r[4].data||[]);
      var names={}; st.forEach(function(x){names[x.me_id]=x.name});
      var nob=st.filter(function(x){return !x.birth});
      var h='<h2>메이크에듀 자료</h2>';

      else if(!run.ok) h+='<div class="alert">마지막 자료 받기 실패 ('+ago(run.at)+')<br>'+esc(run.error||'')+'</div>';
      else h+='<div class="okline">마지막 자료 받기 '+ago(run.at)+' · '+(run.source==='api'?'자동 연결':'엑셀')+' · 재원 '+st.filter(function(x){return x.status==='재원'}).length+'명 · 휴원 '+st.filter(function(x){return x.status==='휴원'}).length+'명</div>';
      if(nob.length) h+='<div class="alert">생년월일이 비어 있는 재원·휴원생 '+nob.length+'명 — 메이크에듀 「생일」 칸에 8자리로 넣어 주세요.<br><span style="font-size:13px">'+nob.slice(0,30).map(function(x){return esc(x.name)}).join(', ')+(nob.length>30?' 외':'')+'</span></div>';
      if(un.length) h+='<div class="alert">홈페이지와 연결이 끊긴 반 '+un.length+'개 — 메이크에듀에서 반 이름이 바뀌었으면 알려 주세요.<br><span style="font-size:13px">'+un.map(esc).join('<br>')+'</span></div>';
      var shown=cls.filter(function(c){return c.site_key});
      if(shown.length){ h+='<h3 style="margin:22px 0 4px;font-size:16px">홈페이지에 보이는 반</h3>'+shown.map(function(c){return '<div class="row2"><span><b>'+esc(c.display_name||c.name)+'</b><br><span style="color:#8A8290;font-size:13px">'+esc(c.teacher||'')+' · '+c.n+'/'+(c.cap||'?')+'명</span></span><span class="stg '+(c.stage||'')+'">'+(STG[c.stage]||'정원 미정')+'</span></div>'}).join('') }
      if(log.length){ h+='<h3 style="margin:22px 0 4px;font-size:16px">최근 변동</h3>'+log.map(function(l){

          var what=l.kind==='상태'?(l.before+' → '+l.after):(l.kind==='자리 단계'?((STG[l.before]||l.before||'')+' → '+(STG[l.after]||l.after||'')):(l.class_id&&l.student_id?l.class_id:(l.after||l.before||'')));
          return '<div class="row2"><span><b>'+esc(KIND[l.kind]||l.kind)+'</b> '+esc(who)+'<br><span style="color:#8A8290;font-size:13px">'+esc(what)+'</span></span><span style="color:#8A8290;font-size:12px;white-space:nowrap">'+ago(l.at)+'</span></div>'}).join('') }
      var rest=st.filter(function(x){return x.status==='휴원'});
      if(rest.length){ h+='<h3 style="margin:22px 0 4px;font-size:16px">휴원생 자리</h3><p style="margin:0 0 6px;color:#8A8290;font-size:13px">선납한 학생만 「자리 유지」로 표시하세요. 표시하지 않으면 빈자리로 계산합니다.</p>'+rest.map(function(x){return '<div class="row2"><span><b>'+esc(x.name)+'</b></span><button type="button" data-hold="'+esc(x.me_id)+'" data-v="'+(x.seat_hold?1:0)+'" class="stg '+(x.seat_hold?'soon':'full')+'" style="border:0;cursor:pointer;font-family:inherit">'+(x.seat_hold?'선납 · 자리 유지':'빈자리로 계산')+'</button></div>'}).join('') }
      h+='<div class="up"><b>엑셀로 자료 올리기</b> <span style="color:#8A8290">(자동 연결 전·오류 때)</span><br>메이크에듀에서 내려받은 두 파일을 고르세요.'+
         '<label>① 원생 전체 목록<input type="file" id="fS" accept=".xlsx,.xls"></label><label>② 수업 목록<input type="file" id="fC" accept=".xlsx,.xls"></label>'+

      box.innerHTML=h;
      document.getElementById('upb').onclick=uploadExcel;
      box.querySelectorAll('[data-hold]').forEach(function(b){ b.onclick=function(){ var id=b.getAttribute('data-hold'), v=b.getAttribute('data-v')!=='1'; b.disabled=true; sb.from('me_students').update({seat_hold:v}).eq('me_id',id).then(function(r){ if(r.error){ b.disabled=false; alert('바꾸지 못했습니다. 다시 눌러 주세요.'); return } meBoard() }) } });
    });
  }
  function loadXLSX(){ return window.XLSX?Promise.resolve():new Promise(function(ok,no){ var s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'; s.onload=ok; s.onerror=no; document.head.appendChild(s) }) }
  function readRows(file){ return file.arrayBuffer().then(function(b){ var wb=XLSX.read(b,{type:'array'}); return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:'',raw:false}) }) }
  function clean(o){ var n={}; Object.keys(o).forEach(function(k){ n[k.trim()]=typeof o[k]==='string'?o[k].trim():o[k] }); return n }
  function uploadExcel(){
    var m=document.getElementById('upm'), fS=document.getElementById('fS').files[0], fC=document.getElementById('fC').files[0];
    if(!fS||!fC){ m.innerHTML='<div class="alert">두 파일을 모두 골라 주세요.</div>'; return }
    m.textContent='읽는 중…';
    loadXLSX().then(function(){ return Promise.all([readRows(fS),readRows(fC)]) }).then(function(r){
      var S=[],E=[],C=[], rs=r[0].map(clean), rc=r[1].map(clean);
      if(!rs.length||!('원생고유번호' in rs[0])) throw new Error('① 파일이 원생 전체 목록이 아닙니다. (원생고유번호 칸이 없음)');
      if(!rc.length||!('수업명' in rc[0])) throw new Error('② 파일이 수업 목록이 아닙니다. (수업명 칸이 없음)');
      rs.forEach(function(x){
        var st=x['재원여부']==='O'&&x['휴원여부']!=='O'?'재원':(x['휴원여부']==='O'?'휴원':'퇴원');
        S.push({me_id:String(x['원생고유번호']),name:x['이름'],school:x['학교'],grade:x['학년'],status:st,birth:String(x['생일']||''),guardian_phone:x['보호자연락처'],joined_on:String(x['입학일']||''),left_on:String(x['퇴원일']||'')});
        if(st!=='퇴원') String(x['수업']||'').split(',').map(function(c){return c.trim()}).filter(Boolean).forEach(function(c){ E.push({class_id:c,student_id:String(x['원생고유번호'])}) });
      });
      rc.forEach(function(c){ C.push({me_id:c['수업명'],name:c['수업명'],teacher:c['담임강사'],cap:String(c['정원']||'').replace(/\.0+$/,''),target:c['대상']}) });
      m.textContent='반영하는 중… (원생 '+S.length+'명, 수업 '+C.length+'개)';
      return sb.rpc('apply_snapshot',{p_source:'excel',p_students:S,p_classes:C,p_enrollments:E});
    }).then(function(res){
      if(res.error) throw new Error(res.error.message);
      m.innerHTML='<div class="okline">반영했습니다. 변동 '+res.data.changes+'건</div>'; setTimeout(meBoard,600);
    }).catch(function(e){ m.innerHTML='<div class="alert">올리지 못했습니다. '+esc(e.message||String(e))+'</div>'; sb.rpc('log_sync_error',{p_source:'excel',p_error:String(e.message||e)}) });
  }
  var myId='';
  function admin(){
    var box=document.getElementById('admin'); box.setAttribute('data-me',myId);
    Promise.all([sb.from('profiles').select('*').order('created_at',{ascending:false}), sb.rpc('admin_member_matches')]).then(function(rr){
      var r=rr[0], mm={}; ((rr[1]&&!rr[1].error&&rr[1].data)||[]).forEach(function(x){ mm[x.profile_id]=x });
      if(r.error) return;
      var matchOf=function(m){
        var x=mm[m.id];
        if(x) return {ok:true, why:'메이크에듀 원생과 연결됨 · '+esc(x.me_name)+' '+esc(x.me_school||'')+' '+esc(x.me_grade||'')};
        return {why: rr[1]&&rr[1].error ? '메이크에듀 자료 준비 전 — 승인하면 번호가 먼저 붙고, 자료가 들어오면 자동 연결됩니다' : '메이크에듀에 아직 없음(신규) — 승인하면 번호가 붙고, 메이크에듀에 등록되면 자동 연결됩니다'};
      };
      var me=(box.getAttribute('data-me')||''); var rows=(r.data||[]).filter(function(m){return m.id!==me});
      box.innerHTML='<h2>원장님 화면 · 학부모 회원 '+rows.length+'명</h2>'+(rows.length?'':'<p class="lead" style="text-align:left">아직 가입한 학부모가 없습니다.</p>')+'<p class="lead" style="text-align:left;margin:0">승인을 누르면 원생번호(JS-0001부터)가 겹치지 않게 자동으로 붙고, 메이크에듀 원생과도 자동으로 연결됩니다.</p>'+
        rows.map(function(m){
          var st={pending:'승인 대기',approved:'승인',rejected:'반려'}[m.status];
          return '<div class="m"><span class="st '+m.status+'">'+st+'</span><b>'+esc(m.child_name||'(미입력)')+'</b> '+esc(m.child_grade||'')+' · '+esc(m.child_school||'')+(m.child_birth?' · '+esc(m.child_birth.replace(/-/g,'')):'')+
            '<br>보호자 '+esc(m.nickname||'')+' · '+esc((m.phone||'번호 미입력').replace(/(\d{3})(\d{3,4})(\d{4})/,'$1-$2-$3'))+(m.student_phone?'<br>학생 '+esc(m.student_phone.replace(/(\d{3})(\d{3,4})(\d{4})/,'$1-$2-$3')):'')+(m.student_no?' · '+esc(m.student_no):'')+
            (m.status!=='approved'&&m.phone?(function(){ var mt=matchOf(m); return '<div style="margin-top:8px;font-size:13px;color:'+(mt.ok?'#2E7D52':'#8C3A22')+'">'+(mt.ok?'✓ ':'')+mt.why+'</div><div class="act"><button class="okb" data-ok="'+m.id+'" style="flex:1">승인 (원생번호 자동 부여)</button><button class="nob" data-no="'+m.id+'">반려</button></div>' })():'')+'</div>';
        }).join('');
      box.onclick=function(e){
        var ok=e.target.getAttribute('data-ok'), no=e.target.getAttribute('data-no');
        if(ok){ e.target.disabled=true; sb.rpc('approve_member',{target:ok}).then(function(res){ if(res.error){ e.target.disabled=false; alert('승인하지 못했습니다. 다시 눌러 주세요.'); return } admin() }) }
        if(no&&confirm('반려할까요?')){ sb.rpc('reject_member',{target:no}).then(admin) }
      };
    });
  }
  sb.auth.getSession().then(function(r){ var s=r.data&&r.data.session; if(s) show(s.user) });
  sb.auth.onAuthStateChange(function(ev,s){ if(s&&s.user) show(s.user) });
})();
</script>
</body>
</html>
