  function loadXLSX(){ return window.XLSX?Promise.resolve():new Promise(function(ok,no){ var s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'; s.onload=ok; s.onerror=no; document.head.appendChild(s) }) }
  function readRows(file){ return file.arrayBuffer().then(function(b){ var wb=XLSX.read(b,{type:'array'}); return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:'',raw:false}) }) }
  function clean(o){ var n={}; Object.keys(o).forEach(function(k){ n[k.trim()]=typeof o[k]==='string'?o[k].trim():o[k] }); return n }
  function uploadExcel(){
    var m=document.getElementById('upm'), fS=document.getElementById('fS').files[0], fC=document.getElementById('fC').files[0];
    if(!fS||!fC){ m.innerHTML='<div class="alert">두 파일을 모두 골라 주세요.</div>'; return }
    m.textContent='읽는 중…';
    loadXLSX().then(function(){ return Promise.all([readRows(fS),readRows(fC)]) }).then(function(r){
      var S=[],E=[],C=[], rs=r[0].map(clean), rc=r[1].map(clean);
      if(!rs.length||!('원생고유번호' in rs[0])) throw new Error('① 파일이 원생 전체 목록이 아닙니다. (원생고유번호 칸이 없음)');
      if(!rc.length||!('수업명' in rc[0])) throw new Error('② 파일이 수업 목록이 아닙니다. (수업명 칸이 없음)');
      rs.forEach(function(x){
        var st=x['재원여부']==='O'&&x['휴원여부']!=='O'?'재원':(x['휴원여부']==='O'?'휴원':'퇴원');
        S.push({me_id:String(x['원생고유번호']),name:x['이름'],school:x['학교'],grade:x['학년'],status:st,birth:String(x['생일']||''),guardian_phone:x['보호자연락처'],joined_on:String(x['입학일']||''),left_on:String(x['퇴원일']||'')});
        if(st!=='퇴원') String(x['수업']||'').split(',').map(function(c){return c.trim()}).filter(Boolean).forEach(function(c){ E.push({class_id:c,student_id:String(x['원생고유번호'])}) });
      });
      rc.forEach(function(c){ C.push({me_id:c['수업명'],name:c['수업명'],teacher:c['담임강사'],cap:String(c['정원']||'').replace(/\.0+$/,''),target:c['대상']}) });
      m.textContent='반영하는 중… (원생 '+S.length+'명, 수업 '+C.length+'개)';
      return sb.rpc('apply_snapshot',{p_source:'excel',p_students:S,p_classes:C,p_enrollments:E});
    }).then(function(res){
      if(res.error) throw new Error(res.error.message);
      m.innerHTML='<div class="okline">반영했습니다. 변동 '+res.data.changes+'건</div>'; setTimeout(meBoard,600);
    }).catch(function(e){ m.innerHTML='<div class="alert">올리지 못했습니다. '+esc(e.message||String(e))+'</div>'; sb.rpc('log_sync_error',{p_source:'excel',p_error:String(e.message||e)}) });
  }

  function uploadAttendance(fs){
    var box=document.getElementById('upam'), m=document.createElement('div'); box.insertBefore(m,box.firstChild);
    m.textContent='읽는 중…';
    loadXLSX().then(function(){ return Promise.all(fs.map(readRows)) }).then(function(all){
      var rows=[], months={};
      all.forEach(function(rs,fi){
        rs=rs.map(clean);
        if(!rs.length||!('날짜' in rs[0])||!('이름' in rs[0])) throw new Error(fs[fi].name+' — 출석부 파일이 아닙니다. (날짜·이름 칸이 없음)');
        rs.forEach(function(x){
          var ym=String(x['날짜']||'').match(/^(\d{4})-(\d{2})/); if(!ym) return; months[ym[0]]=1;
          var last=new Date(+ym[1],+ym[2],0).getDate();
          for(var d=1; d<=last; d++){ var v=String(x[String(d)]||'').trim(); if(v==='O'||v==='X'||v==='△') rows.push({name:x['이름'],school:x['학교']||'',class:x['수업']||'',day:ym[0]+'-'+(d<10?'0':'')+d,mark:v}) }
        });
      });
      if(!rows.length){ m.innerHTML='<div class="okline">'+esc(Object.keys(months).sort().join(', '))+' — 출결 기록이 없는 달입니다. 넘어갑니다.</div>'; return null }
      m.textContent='반영하는 중… ('+Object.keys(months).sort().join(', ')+' · '+rows.length+'칸)'; m.setAttribute('data-ym',Object.keys(months).sort().join(', '));
      return sb.rpc('apply_attendance_named',{p_rows:rows});
    }).then(function(res){
      if(!res) return;
      if(res.error) throw new Error(res.error.message);
      var un=res.data.unmatched||[];
      m.innerHTML='<div class="okline">'+esc(m.getAttribute('data-ym')||'')+' 출결 '+res.data.saved+'건을 반영했습니다.</div>'+(un.length?'<div class="alert">명부에서 찾지 못한 학생 '+un.length+'명 — 메이크에듀 원생 목록을 먼저 올린 뒤 다시 반영해 주세요.<br><span style="font-size:13px">'+un.map(esc).join(', ')+'</span></div>':'');
    }).catch(function(e){ m.innerHTML='<div class="alert">반영하지 못했습니다. '+esc(e.message||String(e))+'</div>' });
  }

        '<div style="margin-top:14px">'+cls.map(function(c){return '<div class="row"><span>'+c[0]+'</span><span>'+c[1]+' 선생님</span></div>'}).join('')+'</div></div>' };
      body='<h1>김OO님</h1><p class="lead"><span class="badge">승인 완료</span></p>'+
        kid('김하늘','JS-0001','초3',[['월요일 오후 5:00','윤슬'],['목요일 오후 3:30','도담']])+kid('김바다','JS-0002','7세',[['화요일 오후 4:30','도담']])+
        '<div class="card"><div class="row"><span>김하늘 · 초3</span><span>이촌초 · 승인 · JS-0001</span></div><div class="row"><span>김바다 · 7세</span><span>승인 · JS-0002</span></div></div>'+
        '<button class="ghost" type="button" disabled>자녀 추가 · 정보 고치기</button>';
    }
    out.innerHTML=ban+tabs+body+'<a class="primary" href="member.html" style="display:flex;align-items:center;justify-content:center;text-decoration:none">카카오로 시작하기</a>';
    out.querySelectorAll('[data-tab]').forEach(function(b){ b.onclick=function(){ demo(b.getAttribute('data-tab')); scrollTo(0,0) } });
  }
  if(new URLSearchParams(location.search).get('demo')==='1'){ demo(new URLSearchParams(location.search).get('tab')||'p'); return }
  // 앱을 열면 기본은 「학원 둘러보기」(홈페이지). 들어가기 버튼(as=)으로 온 경우에만 회원 화면을 엽니다.
  var _qs=new URLSearchParams(location.search), _as=_qs.get('as');
  if(_as==='student'){ out.innerHTML='<h1>학생 화면</h1><p class="lead">학생 화면은 준비하고 있습니다.<br>열리면 학부모님 앱에서 만든<br>로그인 코드로 들어옵니다.</p><a class="home" href="/?app=1">← 학원 둘러보기</a>'; return }
  if(_as==='teacher'){ var _l=out.querySelector('.lead'); if(_l) _l.innerHTML='선생님은 카카오로 로그인합니다.<br>처음이면 원장님께 받은 초대 링크로 가입해 주세요.' }
  var guest=_qs.get('guest')==='1';
  try{ if(sessionStorage.getItem('js_inapp')!=='1'){ var _hl=document.getElementById('homeLink'); if(_hl){ _hl.href='index.html'; _hl.textContent='← 홈페이지로' } } }catch(e){}
  if(guest){ out.insertAdjacentHTML('afterbegin','<div class="err" style="background:#FBF4E2;color:#7A5A12;margin:0 0 18px">미리보기 · 가입하지 않은 사람이 보는 화면입니다. <a href="member.html" style="color:#5F3D66;font-weight:700">원장 화면으로 돌아가기</a></div>') }
  else {
  sb.auth.getSession().then(function(r){ var s=r.data&&r.data.session; if(s) show(s.user) });
  sb.auth.onAuthStateChange(function(ev,s){ if(s&&s.user) show(s.user) });
  }
})();
</script>
