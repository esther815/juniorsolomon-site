<h2 style="margin: 0; font-family: 'Noto Serif KR', serif; font-size: 28px; font-weight: 600">{{ heading }}</h2>

      submitLabel: pick && pick.wait ? '대기 신청하기' : '상담 신청하기',
      doneKind: self.state.done ? self.state.done.kind : '',
      doneNum: self.state.done ? self.state.done.num : '',
      doneTitle: self.state.done && self.state.done.sent === 'ok' ? '신청이 접수되었습니다' : (self.state.done && !self.state.done.sent ? '접수하는 중입니다…' : '마지막 한 단계가 남았습니다'),
      doneBody: self.state.done && self.state.done.sent === 'ok' ? '원장님께 바로 전달되었습니다. 곧 연락드리겠습니다. 카톡으로 먼저 이야기 나누고 싶으시면 아래 노란 버튼을 눌러 주세요.' : '아래 노란 버튼을 눌러 카톡으로 보내 주시면 접수가 끝나고, 데스크에서 답을 드립니다.',
      openSheet: function () { self.setState({ sheet: true, done: null, err: '' }); },
      closeSheet: function () { self.setState({ sheet: false, done: null, err: '' }); },
      submit: function () {
        var v = function (id) { var el = document.getElementById(id); return el ? (el.type === 'checkbox' ? el.checked : (el.value || '').trim()) : ''; };
        var name = v('cs-name'), phone = v('cs-phone'), agree = v('cs-agree');
        if (!name) { self.setState({ err: '보호자 성함을 적어 주세요.' }); return; }
        if (!/^0\d{1,2}-?\d{3,4}-?\d{4}$/.test(phone)) { self.setState({ err: '연락처를 010-0000-0000 형식으로 적어 주세요.' }); return; }
        if (!agree) { self.setState({ err: '개인정보 수집·이용에 동의해 주세요.' }); return; }
        var key = pick ? pick.key : 'none:' + text;
        var same = self.state.log.filter(function (r) { return r.key === key; }).length;
        var wait = !!(pick && pick.wait);
        var num = same + 1;
        var kind = wait ? '대기 신청' : '상담 신청';
        var now = new Date();
        var hhmm = (now.getMonth() + 1) + '/' + now.getDate() + ' ' + ('0' + now.getHours()).slice(-2) + ':' + ('0' + now.getMinutes()).slice(-2);
        var masked = phone.replace(/(\d{3})-?(\d{3,4})-?(\d{4})/, '$1-****-$3');
        var log = self.state.log.concat([{ key: key, line: hhmm + ' · ' + text + ' · ' + kind + ' ' + num + '번 · ' + name + ' · ' + masked }]);
        var done = { kind: kind, num: num, sent: '', msg: '[홈페이지 ' + kind + '] ' + text + ' / 보호자 ' + name + ' / ' + phone + ' / 상담 부탁드립니다.' };
        self.setState({ log: log, err: '', done: done });
        var fin = function (r) { if (self.state.done === done) { done = Object.assign({}, done, { sent: (r === 'ok' || r === 'dup') ? 'ok' : 'fail' }); self.setState({ done: done }); } };
        if (window.jsConsult) window.jsConsult(wait ? 'wait' : 'form', text, name, phone, pick && pick.siteKey).then(fin); else fin('fail');
      },
      copyMsg: function () {
        try { if (navigator.clipboard && self.state.done) { navigator.clipboard.writeText(self.state.done.msg); } } catch (e) {}
      },
      log: self.state.log.slice().reverse(),
      logCount: self.state.log.length
    };
  }
}
